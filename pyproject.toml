[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mkfix"
version = "0.2.0"
description = "FIX protocol testing engine built on mkio and mkui"
readme = "README.md"
license = "GPL-2.0-only"
requires-python = ">=3.11"
authors = [{ name = "Mark Kim" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: GNU General Public License v2 (GPLv2)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "mkio>=0.1.65",
    "mkui>=0.1.48",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-asyncio",
    "pytest-aiohttp",
]

[project.urls]
Homepage = "https://github.com/markuskimius/mkfix"
Repository = "https://github.com/markuskimius/mkfix"
Issues = "https://github.com/markuskimius/mkfix/issues"

[project.scripts]
mkfix = "mkfix.__main__:main"
