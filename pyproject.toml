[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mkfix"
dynamic = ["version"]
description = "FIX protocol testing engine built on mkio and mkui"
readme = "README.md"
license = "GPL-2.0-only"
requires-python = ">=3.11"
authors = [{ name = "Mark Kim" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: GNU General Public License v2 (GPLv2)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "mkio>=1.5.0,<2",  # 1.5.0: expression language 2 (and/or/not/in, durations, COUNT), which app.json's `expect.expr` pins
    "mkui>=1.11.0,<2",  # 1.11.0: the dialog's `checklist` field (the Pause and Stop run lists) and `optionsFrom.empty`
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-asyncio",
    "pytest-aiohttp",
]

[project.urls]
Homepage = "https://github.com/markuskimius/mkfix"
Repository = "https://github.com/markuskimius/mkfix"
Issues = "https://github.com/markuskimius/mkfix/issues"

[project.scripts]
mkfix = "mkfix.__main__:main"

[tool.hatch.version]
path = "mkfix/__init__.py"

# Notes for working on the source, not part of the package.
[tool.hatch.build.targets.wheel]
exclude = ["**/CLAUDE.md"]
