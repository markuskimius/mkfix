name = "mkfix"
# version is injected from mkfix.__version__ at load time; do not add one here
port = 8080
host = "0.0.0.0"
db_path = "mkfix.db"
auto_migrate = true
batch_max_size = 1000
batch_max_wait_ms = 2.0

# ─── Tables ─────────────────────────────────────────────────────────

# `archive = {...}` marks a table `mkfix archive` may clear down to CSV (mkio's
# row archiving). The running-data tables are in the default `data` group and
# archive by their FIX-format time column against the cutoff; the config and
# state tables are in the `config` group, archived only when asked for and
# whole (they have no meaningful time column), with fix_session_state riding
# along with its fix_sessions row. FixEngine.check_archive guards the config
# group when the server does the archiving. Every table here is either
# archivable or on the never-archive list in tests/test_archive.py.

# The session's config. Versioned: every edit lands in fix_sessions__history,
# and the History pane, undo and redo read that chain. Its live state (status,
# sequence numbers) is fix_session_state, joined in by sessions_query.
[tables.fix_sessions]
columns = { session_id = "TEXT PRIMARY KEY", fix_version = "TEXT NOT NULL DEFAULT 'FIX.4.2'", dictionary = "TEXT DEFAULT ''", timestamp_precision = "TEXT DEFAULT ''", sender_comp_id = "TEXT NOT NULL", target_comp_id = "TEXT NOT NULL", host = "TEXT DEFAULT ''", port = "INTEGER NOT NULL DEFAULT 9876", heartbeat_interval = "INTEGER DEFAULT 30", logout_timeout = "INTEGER DEFAULT 0", logout_test_request = "INTEGER DEFAULT 1", reset_on_logon = "INTEGER DEFAULT 0", enabled = "INTEGER DEFAULT 1", description = "TEXT DEFAULT ''", client_tags = "TEXT DEFAULT ''" }
versioned = true
archive = { group = "config", with = ["fix_session_state"] }

[tables.fix_session_state]
columns = { session_id = "TEXT PRIMARY KEY", status = "TEXT DEFAULT 'DOWN'", tx_seq_num = "INTEGER DEFAULT 1", rx_seq_num = "INTEGER DEFAULT 1", last_tx_time = "TEXT DEFAULT ''", last_rx_time = "TEXT DEFAULT ''", session_start = "TEXT DEFAULT ''", error_text = "TEXT DEFAULT ''", seq_epoch = "INTEGER DEFAULT 0" }

[tables.fix_messages]
columns = { id = "INTEGER PRIMARY KEY AUTOINCREMENT", session_id = "TEXT NOT NULL", timestamp = "TEXT NOT NULL", direction = "TEXT NOT NULL", seq_num = "INTEGER DEFAULT 0", msg_type = "TEXT DEFAULT ''", msg_type_name = "TEXT DEFAULT ''", category = "TEXT DEFAULT 'APP'", raw_message = "TEXT NOT NULL", sender_comp = "TEXT DEFAULT ''", target_comp = "TEXT DEFAULT ''", cl_ord_id = "TEXT DEFAULT ''", order_id = "TEXT DEFAULT ''", exec_id = "TEXT DEFAULT ''", symbol = "TEXT DEFAULT ''", side = "TEXT DEFAULT ''", body_length = "INTEGER DEFAULT 0", checksum = "TEXT DEFAULT ''", client = "TEXT DEFAULT ''" }
archive = { cutoff = "timestamp", format = "%Y%m%d-%H:%M:%S.000" }

# orders_query/executions_query join the owning session's live status onto
# these rows as session_status, which the blotters' action buttons gate on.
[tables.fix_orders]
columns = { id = "INTEGER PRIMARY KEY AUTOINCREMENT", cl_ord_id = "TEXT NOT NULL", session_id = "TEXT NOT NULL", order_id = "TEXT DEFAULT ''", orig_cl_ord_id = "TEXT DEFAULT ''", symbol = "TEXT NOT NULL DEFAULT ''", side = "TEXT NOT NULL DEFAULT ''", side_code = "TEXT DEFAULT ''", ord_type = "TEXT DEFAULT ''", ord_type_code = "TEXT DEFAULT ''", price = "REAL DEFAULT 0", stop_price = "REAL DEFAULT 0", order_qty = "REAL DEFAULT 0", time_in_force = "TEXT DEFAULT ''", status = "TEXT DEFAULT 'PendingNew'", cum_qty = "REAL DEFAULT 0", avg_price = "REAL DEFAULT 0", leaves_qty = "REAL DEFAULT 0", last_qty = "REAL DEFAULT 0", last_price = "REAL DEFAULT 0", text = "TEXT DEFAULT ''", transact_time = "TEXT DEFAULT ''", created_at = "TEXT DEFAULT ''", updated_at = "TEXT DEFAULT ''", direction = "TEXT NOT NULL DEFAULT 'TX'", pending_action = "TEXT DEFAULT ''", pending_cl_ord_id = "TEXT DEFAULT ''", pending_qty = "REAL DEFAULT 0", pending_price = "REAL DEFAULT 0", pending_extra_tags = "TEXT DEFAULT ''", tif_code = "TEXT DEFAULT ''", extra_tags = "TEXT DEFAULT ''", entered_qty = "REAL DEFAULT 0", entered_price = "REAL", expire_time = "TEXT DEFAULT ''", expire_date = "TEXT DEFAULT ''", client = "TEXT DEFAULT ''" }
versioned = true
archive = { cutoff = "created_at", format = "%Y%m%d-%H:%M:%S.000" }

[tables.fix_executions]
columns = { id = "INTEGER PRIMARY KEY AUTOINCREMENT", session_id = "TEXT NOT NULL", exec_id = "TEXT NOT NULL", exec_ref_id = "TEXT DEFAULT ''", trade_id = "TEXT DEFAULT ''", order_id = "TEXT DEFAULT ''", cl_ord_id = "TEXT DEFAULT ''", symbol = "TEXT NOT NULL DEFAULT ''", side = "TEXT NOT NULL DEFAULT ''", side_code = "TEXT DEFAULT ''", last_qty = "REAL NOT NULL DEFAULT 0", last_price = "REAL NOT NULL DEFAULT 0", cum_qty = "REAL DEFAULT 0", avg_price = "REAL DEFAULT 0", exec_type = "TEXT DEFAULT ''", exec_type_code = "TEXT DEFAULT ''", leaves_qty = "REAL DEFAULT 0", transact_time = "TEXT DEFAULT ''", text = "TEXT DEFAULT ''", timestamp = "TEXT NOT NULL DEFAULT ''", direction = "TEXT NOT NULL DEFAULT 'RX'", dk_reason = "TEXT DEFAULT ''", dk_text = "TEXT DEFAULT ''", client = "TEXT DEFAULT ''" }
versioned = true
archive = { cutoff = "timestamp", format = "%Y%m%d-%H:%M:%S.000" }

[tables.fix_iois]
columns = { id = "INTEGER PRIMARY KEY AUTOINCREMENT", session_id = "TEXT NOT NULL", ioi_id = "TEXT NOT NULL", ioi_trans_type = "TEXT DEFAULT ''", symbol = "TEXT DEFAULT ''", side = "TEXT DEFAULT ''", ioi_qty = "TEXT DEFAULT ''", price = "REAL DEFAULT 0", valid_until = "TEXT DEFAULT ''", timestamp = "TEXT NOT NULL DEFAULT ''", direction = "TEXT NOT NULL DEFAULT ''", raw_message = "TEXT DEFAULT ''" }
archive = { cutoff = "timestamp", format = "%Y%m%d-%H:%M:%S.000" }

[tables.fix_allocations]
columns = { id = "INTEGER PRIMARY KEY AUTOINCREMENT", session_id = "TEXT NOT NULL", alloc_id = "TEXT NOT NULL", alloc_trans_type = "TEXT DEFAULT ''", alloc_type = "TEXT DEFAULT ''", symbol = "TEXT DEFAULT ''", side = "TEXT DEFAULT ''", quantity = "REAL DEFAULT 0", avg_price = "REAL DEFAULT 0", trade_date = "TEXT DEFAULT ''", alloc_status = "TEXT DEFAULT ''", num_allocs = "INTEGER DEFAULT 0", timestamp = "TEXT NOT NULL DEFAULT ''", direction = "TEXT NOT NULL DEFAULT ''", raw_message = "TEXT DEFAULT ''" }
archive = { cutoff = "timestamp", format = "%Y%m%d-%H:%M:%S.000" }

# ID generator state: one row per ID prefix holding its counter (see
# mkfix/fix/idgen.py).
[tables.fix_id_state]
columns = { name = "TEXT PRIMARY KEY", counter = "INTEGER DEFAULT 0" }
archive = { group = "config" }

# Engine settings that outlive a run: currently only instance_code, the two
# characters generated IDs carry after their type code. `mkfix -i CODE` saves
# it here and later runs reuse it; `-i ''` saves '' (back to the username).
[tables.fix_settings]
columns = { key = "TEXT PRIMARY KEY", value = "TEXT DEFAULT ''" }
archive = { group = "config" }

# User-defined FIX dictionaries: doc is JSON — a delta over base_version when
# one is set, a complete standalone document otherwise. Written through fix_cmd
# (create/update/delete_dictionary) so the engine's in-memory registry stays in
# step; resolution lives in mkfix/fix/dictionary.py.
[tables.fix_dictionaries]
columns = { name = "TEXT PRIMARY KEY", base_version = "TEXT DEFAULT ''", doc = "TEXT NOT NULL DEFAULT '{}'", created_at = "TEXT DEFAULT ''", updated_at = "TEXT DEFAULT ''" }
archive = { group = "config" }

[tables.fix_replay_jobs]
columns = { id = "INTEGER PRIMARY KEY AUTOINCREMENT", name = "TEXT NOT NULL", file_path = "TEXT NOT NULL", status = "TEXT DEFAULT 'loaded'", target_session = "TEXT DEFAULT ''", speed = "REAL DEFAULT 1.0", msg_filter = "TEXT DEFAULT ''", total_messages = "INTEGER DEFAULT 0", sent_messages = "INTEGER DEFAULT 0", error_text = "TEXT DEFAULT ''", created_at = "TEXT DEFAULT ''" }
archive = { group = "config" }

# Saved window layouts for mkui's Layout menu: one row per save, the newest
# being the user's current layout and the older ones its restorable history
# (the client prunes through `delete`). mkfix has no login, so every save
# lands under owner '' — the default history shared by everyone on this server.
[tables.mkui_layouts]
columns = { id = "INTEGER PRIMARY KEY AUTOINCREMENT", app = "TEXT NOT NULL DEFAULT ''", owner = "TEXT NOT NULL DEFAULT ''", saved = "TEXT DEFAULT CURRENT_TIMESTAMP", layout = "TEXT NOT NULL" }
archive = { cutoff = "saved", group = "config" }

# Blotter action templates: the terms a dialog would otherwise ask for again
# — an order to send, the fill or reject to answer with, a DK — kept by name
# under the dialog they belong to (`scope`: order, cancel, accept, reject,
# fill, dk, correct, bust; unique per scope, an engine index). One superset
# of columns, each scope reading its own; qty/price are kept as typed, since
# a blank one means "ask the row" (a fill's leaves, say). Every such dialog
# opens on a Template dropdown (`templates_list`) and closes on a Save-as
# name (the engine's `save_template`, through the fix_cmd op); the Templates
# pane edits and deletes through the `templates` service. Shared by everyone
# on the server, like layouts.
[tables.fix_templates]
columns = { id = "INTEGER PRIMARY KEY AUTOINCREMENT", scope = "TEXT NOT NULL", name = "TEXT NOT NULL", session_id = "TEXT DEFAULT ''", symbol = "TEXT DEFAULT ''", side = "TEXT DEFAULT ''", ord_type = "TEXT DEFAULT ''", qty = "TEXT DEFAULT ''", price = "TEXT DEFAULT ''", tif = "TEXT DEFAULT ''", dk_reason = "TEXT DEFAULT ''", text = "TEXT DEFAULT ''", extra_tags = "TEXT DEFAULT ''", client = "TEXT DEFAULT ''", created_at = "TEXT DEFAULT CURRENT_TIMESTAMP" }
archive = { group = "config" }

# ─��─ Transaction Services ───────────────────────────────────────────

[services.session_mgmt]
protocol = "transaction"

[services.session_mgmt.ops]
add = [
    { table = "fix_sessions", op_type = "insert", fields = ["session_id", "fix_version", "dictionary", "timestamp_precision", "sender_comp_id", "target_comp_id", "host", "port", "heartbeat_interval", "logout_timeout", "logout_test_request", "reset_on_logon", "description", "client_tags"], defaults = { fix_version = "FIX.4.2", dictionary = "", timestamp_precision = "", host = "", port = 9876, heartbeat_interval = 30, logout_timeout = 0, logout_test_request = 1, reset_on_logon = 0, description = "", client_tags = "" } },
    { table = "fix_session_state", op_type = "insert", fields = ["session_id"], defaults = { status = "DOWN" } },
]
update = [
    { table = "fix_sessions", op_type = "update", key = ["session_id"], fields = ["fix_version", "dictionary", "timestamp_precision", "sender_comp_id", "target_comp_id", "host", "port", "heartbeat_interval", "logout_timeout", "logout_test_request", "reset_on_logon", "enabled", "description", "client_tags"], defaults = { client_tags = "" } },
]
delete = [
    { table = "fix_session_state", op_type = "delete", key = ["session_id"] },
    { table = "fix_sessions", op_type = "delete", key = ["session_id"] },
]
# Step a session's config back and forth along fix_sessions__history. The
# engine follows through FixEngine.handle_undo_redo (mkio's on_undo_redo
# hook): a stopped session is rebuilt, a running one swaps config for its
# next start, an undone add stops and drops the session, a redone add
# rebuilds it. A Delete is a real delete in mkio and takes the chain with it.
undo = [{ table = "fix_sessions", op_type = "undo", key = ["session_id"] }]
redo = [{ table = "fix_sessions", op_type = "redo", key = ["session_id"] }]

[services.replay_mgmt]
protocol = "transaction"

[services.replay_mgmt.ops]
create = [
    { table = "fix_replay_jobs", op_type = "insert", fields = ["name", "file_path", "target_session", "speed", "msg_filter"] },
]
update_status = [
    { table = "fix_replay_jobs", op_type = "update", key = ["id"], fields = ["status", "sent_messages", "error_text"] },
]

# fix_cmd (custom FIX command service) is registered programmatically
# via app.add_service() in __main__.py.

# ─── ReqRep Services ────────────────────────────────────────────────

# Feeds the session dropdown in the Sent Orders "New" dialog: dialog
# optionsFrom needs request-reply, which query services do not answer.
[services.sessions_list]
protocol = "reqrep"
sql = "SELECT session_id FROM fix_sessions ORDER BY session_id"

# Dictionary choices for the session dialogs: '' = the standard dictionary for
# the session's FIX version, then the shipped standards, then custom rows.
[services.dictionaries_list]
protocol = "reqrep"
sql = "SELECT '' AS name, '(standard for version)' AS label UNION ALL SELECT v, v FROM (SELECT 'FIX.4.0' AS v UNION ALL SELECT 'FIX.4.1' UNION ALL SELECT 'FIX.4.2' UNION ALL SELECT 'FIX.4.3' UNION ALL SELECT 'FIX.4.4' UNION ALL SELECT 'FIX.5.0' UNION ALL SELECT 'FIX.5.0SP1' UNION ALL SELECT 'FIX.5.0SP2') UNION ALL SELECT name, name FROM fix_dictionaries ORDER BY name"

# Blotter action templates (fix_templates): the Templates pane's Edit and
# Delete, plus `add` for scripting. Each op takes every term column so one
# serves every scope: a dialog sends its scope's fields and the rest default
# blank; `update` is keyed by id. Dialogs save through fix_cmd instead.
[services.templates]
protocol = "transaction"
description = "Save, edit and delete blotter action templates"

[services.templates.ops]
add = [
    { table = "fix_templates", op_type = "insert", fields = ["scope", "name", "session_id", "symbol", "side", "ord_type", "qty", "price", "tif", "dk_reason", "text", "extra_tags", "client"], defaults = { session_id = "", symbol = "", side = "", ord_type = "", qty = "", price = "", tif = "", dk_reason = "", text = "", extra_tags = "", client = "" } },
]
update = [
    { table = "fix_templates", op_type = "update", key = ["id"], fields = ["name", "session_id", "symbol", "side", "ord_type", "qty", "price", "tif", "dk_reason", "text", "extra_tags", "client"], defaults = { session_id = "", symbol = "", side = "", ord_type = "", qty = "", price = "", tif = "", dk_reason = "", text = "", extra_tags = "", client = "" } },
]
delete = [
    { table = "fix_templates", op_type = "delete", key = ["id"] },
]

# mkui's layout store: the shapes `mkui init` scaffolds, minus the `access`
# pre-checks, which need a login (`_mkio_users`) mkfix does not have.
[services.mkui_layouts]
protocol = "transaction"
description = "Save and delete window layouts"

[services.mkui_layouts.ops]
save = { table = "mkui_layouts", op_type = "insert", fields = ["app", "owner", "layout"] }
delete = { table = "mkui_layouts", op_type = "delete", key = ["id"] }

[services.mkui_layouts_list]
protocol = "reqrep"
description = "Saved layouts of one app and owner, newest first"
sql = "SELECT id, saved FROM mkui_layouts WHERE app = :app AND owner = :owner ORDER BY id DESC"

[services.mkui_layouts_get]
protocol = "reqrep"
description = "One saved layout"
sql = "SELECT id, saved, layout FROM mkui_layouts WHERE id = :id"

# ─── Query Services ─────────────────────────────────────────────────

# The blotters read a session's live state through a join on
# fix_session_state (mkio 0.8 re-runs the SQL when a watched table changes
# and publishes only the rows that differ). LEFT JOIN with defaults: a redone
# Add has its config row back before the engine re-inserts the state row.
# `key` keeps _mkio_row the primary key, which the history blocks key by.
# The state table is written on every message; orders_query and
# executions_query read only its status, and `watch_columns` says so, so a
# sequence-number write is dropped before any re-query (mkio 0.10).
[services.sessions_query]
protocol = "query"
primary_table = "fix_sessions"
watch_tables = ["fix_sessions", "fix_session_state"]
key = ["session_id"]
sql = """SELECT s.*, COALESCE(t.status, 'DOWN') AS status,
                COALESCE(t.tx_seq_num, 1) AS tx_seq_num, COALESCE(t.rx_seq_num, 1) AS rx_seq_num,
                COALESCE(t.error_text, '') AS error_text, COALESCE(t.session_start, '') AS session_start,
                COALESCE(t.last_tx_time, '') AS last_tx_time, COALESCE(t.last_rx_time, '') AS last_rx_time
         FROM fix_sessions s LEFT JOIN fix_session_state t ON t.session_id = s.session_id"""
filterable = ["session_id", "enabled", "status"]

[services.orders_query]
protocol = "query"
primary_table = "fix_orders"
watch_tables = ["fix_orders", "fix_session_state"]
watch_columns = { fix_session_state = ["status"] }
key = ["id"]
sql = """SELECT o.*, COALESCE(t.status, 'DOWN') AS session_status
         FROM fix_orders o LEFT JOIN fix_session_state t ON t.session_id = o.session_id"""
filterable = ["session_id", "status", "symbol", "side", "direction", "session_status", "client"]

[services.executions_query]
protocol = "query"
primary_table = "fix_executions"
watch_tables = ["fix_executions", "fix_session_state"]
watch_columns = { fix_session_state = ["status"] }
key = ["id"]
sql = """SELECT e.*, COALESCE(t.status, 'DOWN') AS session_status
         FROM fix_executions e LEFT JOIN fix_session_state t ON t.session_id = e.session_id"""
filterable = ["session_id", "symbol", "side", "direction", "session_status", "client"]

[services.messages_query]
protocol = "query"
primary_table = "fix_messages"
filterable = ["session_id", "direction", "msg_type", "category", "symbol", "client"]

[services.iois_query]
protocol = "query"
primary_table = "fix_iois"
filterable = ["session_id", "symbol", "side"]

[services.allocations_query]
protocol = "query"
primary_table = "fix_allocations"
filterable = ["session_id", "symbol"]

[services.templates_query]
protocol = "query"
primary_table = "fix_templates"
filterable = ["scope"]

# One scope's templates for a dialog's Template dropdown, every term column
# along so the pick fills the form (mkui's `fill`).
[services.templates_list]
protocol = "reqrep"
sql = "SELECT id, name, scope, session_id, symbol, side, ord_type, qty, price, tif, dk_reason, text, extra_tags, client FROM fix_templates WHERE scope = :scope ORDER BY name"

[services.replay_jobs]
protocol = "query"
primary_table = "fix_replay_jobs"

# ─── Record History ─────────────────────────────────────────────────

# fix_sessions, fix_orders and fix_executions are versioned (mkio 0.6): every
# change to a row lands in <table>__history and the live row's _mkio_version
# is the cursor into that chain. mkio advertises no history table and writes
# no service for one, so the services below are what the blotters' `history`
# blocks in app.json name: one record's chain, where its cursor sits, the
# feed the History pane is built on, and the table as it stood at a moment.
# Sent/Received Orders share the orders chain and feed (both read fix_orders),
# as do the two trade blotters; only the as-of views are split by direction,
# because a blotter's `filter` narrows its live subscription and nothing else.

[services.sessions_versions]
protocol = "reqrep"
description = "One session's recorded versions, oldest first"
sql = "SELECT * FROM fix_sessions__history WHERE session_id = :session_id ORDER BY _mkio_version"

[services.sessions_state]
protocol = "reqrep"
description = "Where a session sits in its chain: the live version and the highest recorded"
sql = "SELECT (SELECT _mkio_version FROM fix_sessions WHERE session_id = :session_id) AS current, MAX(_mkio_version) AS top FROM fix_sessions__history WHERE session_id = :session_id"

[services.sessions_history]
protocol = "query"
description = "Every recorded session version, newest first, live"
primary_table = "fix_sessions__history"
sql = "SELECT * FROM fix_sessions__history ORDER BY _mkio_ref DESC"
filterable = ["session_id", "_mkio_op", "_mkio_version"]
change_log_size = 10000

# For each row, the newest version recorded at or before `as_of`. Refs sort
# lexicographically, so the cutoff is an ordinary range scan.
[services.sessions_as_of]
protocol = "reqrep"
description = "The sessions as they stood at a moment"
sql = """
SELECT h.* FROM fix_sessions__history h
  JOIN (SELECT session_id, MAX(_mkio_version) AS v
          FROM fix_sessions__history
         WHERE _mkio_ref <= :as_of
      GROUP BY session_id) latest
    ON h.session_id = latest.session_id AND h._mkio_version = latest.v
 ORDER BY h.session_id
"""

[services.orders_versions]
protocol = "reqrep"
description = "One order's recorded versions, oldest first"
sql = "SELECT * FROM fix_orders__history WHERE id = :id ORDER BY _mkio_version"

[services.orders_state]
protocol = "reqrep"
description = "Where an order sits in its chain: the live version and the highest recorded"
sql = "SELECT (SELECT _mkio_version FROM fix_orders WHERE id = :id) AS current, MAX(_mkio_version) AS top FROM fix_orders__history WHERE id = :id"

[services.orders_history]
protocol = "query"
description = "Every recorded order version, newest first, live"
primary_table = "fix_orders__history"
sql = "SELECT * FROM fix_orders__history ORDER BY _mkio_ref DESC"
filterable = ["id", "session_id", "cl_ord_id", "order_id", "direction", "_mkio_op", "_mkio_version"]
change_log_size = 10000

[services.sent_orders_as_of]
protocol = "reqrep"
description = "The sent orders as they stood at a moment"
sql = """
SELECT h.* FROM fix_orders__history h
  JOIN (SELECT id, MAX(_mkio_version) AS v
          FROM fix_orders__history
         WHERE _mkio_ref <= :as_of
      GROUP BY id) latest
    ON h.id = latest.id AND h._mkio_version = latest.v
 WHERE h.direction = 'TX'
 ORDER BY h.id
"""

[services.received_orders_as_of]
protocol = "reqrep"
description = "The received orders as they stood at a moment"
sql = """
SELECT h.* FROM fix_orders__history h
  JOIN (SELECT id, MAX(_mkio_version) AS v
          FROM fix_orders__history
         WHERE _mkio_ref <= :as_of
      GROUP BY id) latest
    ON h.id = latest.id AND h._mkio_version = latest.v
 WHERE h.direction = 'RX'
 ORDER BY h.id
"""

[services.executions_versions]
protocol = "reqrep"
description = "One execution's recorded versions, oldest first"
sql = "SELECT * FROM fix_executions__history WHERE id = :id ORDER BY _mkio_version"

[services.executions_state]
protocol = "reqrep"
description = "Where an execution sits in its chain: the live version and the highest recorded"
sql = "SELECT (SELECT _mkio_version FROM fix_executions WHERE id = :id) AS current, MAX(_mkio_version) AS top FROM fix_executions__history WHERE id = :id"

[services.executions_history]
protocol = "query"
description = "Every recorded execution version, newest first, live"
primary_table = "fix_executions__history"
sql = "SELECT * FROM fix_executions__history ORDER BY _mkio_ref DESC"
filterable = ["id", "session_id", "trade_id", "exec_id", "exec_ref_id", "order_id", "direction", "_mkio_op", "_mkio_version"]
change_log_size = 10000

[services.received_trades_as_of]
protocol = "reqrep"
description = "The received trades as they stood at a moment"
sql = """
SELECT h.* FROM fix_executions__history h
  JOIN (SELECT id, MAX(_mkio_version) AS v
          FROM fix_executions__history
         WHERE _mkio_ref <= :as_of
      GROUP BY id) latest
    ON h.id = latest.id AND h._mkio_version = latest.v
 WHERE h.direction = 'RX'
 ORDER BY h.id
"""

[services.sent_trades_as_of]
protocol = "reqrep"
description = "The sent trades as they stood at a moment"
sql = """
SELECT h.* FROM fix_executions__history h
  JOIN (SELECT id, MAX(_mkio_version) AS v
          FROM fix_executions__history
         WHERE _mkio_ref <= :as_of
      GROUP BY id) latest
    ON h.id = latest.id AND h._mkio_version = latest.v
 WHERE h.direction = 'TX'
 ORDER BY h.id
"""

# ─── Stream Services ────────────────────────────────────────────────

[services.messages_stream]
protocol = "stream"
primary_table = "fix_messages"
buffer_size = 50000
filterable = ["session_id", "direction", "msg_type", "category", "client"]

[services.executions_stream]
protocol = "stream"
primary_table = "fix_executions"
buffer_size = 50000

# ─── Static Serving ─────────────────────────────────────────────────

[static]
"/" = "./static"
"/mkui" = "__mkui__"
"/dictionaries" = "./fix/dictionary_data"
