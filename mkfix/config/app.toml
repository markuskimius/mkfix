    format = "%Y-%m-%d %H:%M:%S.%f %Z"
    zone = "local"

    [panes.ioi-blotter.types.updated_at]
    type = "time"
    parse = "%Y%m%d-%H:%M:%S.%f"
    format = "%Y-%m-%d %H:%M:%S.%f %Z"
    zone = "local"

  [panes.ioi-blotter.styles]
  status = [
    { when = "value == 'Active'", color = "#4ec9b0" },
    { when = "value == 'Canceled'", color = "#858585", strike = true },
    { when = "value == 'Failed'", color = "#f44747" },
  ]

    [[panes.ioi-blotter.styles.side]]
    when = "value == 'Buy'"
    color = "#4ec9b0"

    [[panes.ioi-blotter.styles.side]]
    when = "CONTAINS(['Sell', 'SellShort', 'SellShortExempt', 'SellPlus'], value)"
    color = "#f44747"

