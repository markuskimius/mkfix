# mkfix UI config: the mkui app (menubar, dialogs, panes, frames).
# mkio serves this file to the browser as /config/app.json.

# ─── App ──────────────────────────────────────────────────────────

[app]
title = "mkfix — FIX Protocol Testing Engine"
theme = "dark"
version = "0.90"
description = "FIX protocol testing engine built on mkio and mkui"
copyright = "© Mark Kim · GPL-2.0-only"

  [[app.links]]
  label = "GitHub"
  href = "https://github.com/markuskimius/mkfix"

  [[app.links]]
  label = "Report an issue"
  href = "https://github.com/markuskimius/mkfix/issues"

  [[app.links]]
  label = "License"
  href = "https://github.com/markuskimius/mkfix/blob/main/LICENSE"

  [[app.links]]
  label = "FIX dictionary notice"
  href = "https://github.com/markuskimius/mkfix/blob/main/mkfix/fix/dictionary_data/NOTICE"

  [app.about]
  title = "About mkfix"
  width = 470
  heading = "mkfix ${app.version}"
  message = [
    "${app.description}", "${app.copyright}",
    "Free software under the GNU GPL version 2, with no warranty.",
  ]
  builtins = false
  facts = [
    { label = "Server", value = "${state.mkio.server.name} ${state.mkio.server.version}" },
    { label = "mkui", value = "${app.mkui}" },
    { label = "mkio", value = "${state.mkio.server.mkio}" },
  ]

# ─── State ────────────────────────────────────────────────────────
# TOML has no null: "" stands in for it, which every reader here treats as unset.

[state]
status = { message = "Connecting...", background = "#858585", color = "#000" }
selected_session = ""
selected_message = ""
selected_macro = ""
selected_macro_order = ""
help_target = ""
open_example = ""
macros = ""
open_macro = ""

# ─── Menubar ──────────────────────────────────────────────────────

[[menubar]]
label = "FIX"
items = [
  { label = "Sessions", action = "pane.show", args = "session-blotter" },
  { sep = true },
  { label = "Messages", action = "pane.show", args = "raw-messages" },
  { label = "Detail", action = "pane.show", args = "message-detail" },
  { sep = true },
  { label = "Replay Control", action = "pane.show", args = "replay-control" },
]

[[menubar]]
label = "Edit"
items = [
  { label = "Undo Session Change", action = "edit.undo" },
  { label = "Redo Session Change", action = "edit.redo" },
  { sep = true },
  { label = "Copy", action = "edit.copy", shortcut = "mod+C" },
  { label = "Select All", action = "edit.selectAll", shortcut = "mod+A" },
]

[[menubar]]
label = "Client"
items = [
  { label = "Sent Orders", action = "pane.show", args = "order-blotter" },
  { label = "Received Trades", action = "pane.show", args = "trade-blotter" },
  { sep = true },
  { label = "Sent Lists", action = "pane.show", args = "list-blotter" },
  { label = "Sent Order Legs", action = "pane.show", args = "sent-legs" },
  { sep = true },
  { label = "Received IOIs", action = "pane.show", args = "ioi-blotter" },
  { label = "Received Adverts", action = "pane.show", args = "advert-blotter" },
  { label = "Received Allocations", action = "pane.show", args = "allocation-blotter" },
  { sep = true },
  { label = "Sent RFQs", action = "pane.show", args = "rfq-blotter" },
  { label = "Received Quotes", action = "pane.show", args = "quote-blotter" },
  { label = "Received RFQ Requests", action = "pane.show", args = "rfq-request-blotter" },
]

[[menubar]]
label = "Market"
items = [
  { label = "Received Orders", action = "pane.show", args = "market-order-blotter" },
  { label = "Sent Trades", action = "pane.show", args = "market-trade-blotter" },
  { sep = true },
  { label = "Received Lists", action = "pane.show", args = "market-list-blotter" },
  { label = "Received Order Legs", action = "pane.show", args = "received-legs" },
  { sep = true },
  { label = "Sent IOIs", action = "pane.show", args = "market-ioi-blotter" },
  { label = "Sent Adverts", action = "pane.show", args = "market-advert-blotter" },
  { label = "Sent Allocations", action = "pane.show", args = "market-allocation-blotter" },
  { sep = true },
  { label = "Received RFQs", action = "pane.show", args = "market-rfq-blotter" },
  { label = "Sent Quotes", action = "pane.show", args = "market-quote-blotter" },
  { label = "Sent RFQ Requests", action = "pane.show", args = "market-rfq-request-blotter" },
]

[[menubar]]
label = "Macro"
items = [
  { label = "Client Macros", action = "pane.show", args = "client-macros" },
  { label = "Client Macro Runs", action = "frame.show", args = "client-runs" },
  { sep = true },
  { label = "Market Macros", action = "pane.show", args = "market-macros" },
  { label = "Market Macro Runs", action = "frame.show", args = "market-runs" },
  { sep = true },
  { label = "End-to-end Macros", action = "pane.show", args = "end-to-end-macros" },
  { label = "End-to-end Macro Runs", action = "frame.show", args = "end-to-end-runs" },
]

[[menubar]]
label = "Config"
items = [
  { label = "Templates", action = "pane.show", args = "templates" },
  { label = "Instruments", action = "pane.show", args = "instruments" },
  { label = "Dictionaries", action = "pane.show", args = "dictionaries" },
]

[[menubar]]
label = "Layout"
items = [
  { label = "Save Layout", action = "layout.save" },
  { label = "Restore Layout", layouts = true },
  { sep = true },
  { label = "Reset to Default", action = "layout.reset" },
]

[[menubar]]
label = "Window"
items = [
  { label = "Tile Horizontal", action = "window.tileH" },
  { label = "Tile Vertical", action = "window.tileV" },
  { label = "Grid", action = "window.grid" },
  { label = "Cascade", action = "window.cascade" },
  { sep = true },
  { windows = true },
]

[[menubar]]
label = "Help"
items = [
  { label = "User Guide", action = "pane.show", args = "help-guide" },
  { sep = true },
  { label = "Macro Language", action = "pane.show", args = "help-viewer" },
  { label = "Macro Editor Keys", action = "dialog.open", args = "macro_keys" },
  { label = "Replaying a Log", action = "pane.show", args = "help-replay" },
  { sep = true },
  { label = "Keyboard Shortcuts", action = "dialog.open", args = "shortcuts" },
  { sep = true },
  { label = "About mkfix", action = "dialog.about" },
]

# ─── Dialogs ──────────────────────────────────────────────────────

[dialogs]

[dialogs.shortcuts]
