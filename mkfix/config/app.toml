[panes.replay-control]
title = "Replay"
type = "mkio-table"
service = "replay_jobs"
protocol = "query"
columns = [
  "id", "name", "status", "target_session", "session_status", "direction", "sent_messages",
  "selected_messages", "total_messages", "pairs", "first_time", "last_time", "speed", "max_gap",
  "time_from", "time_to", "msg_filter", "file_path", "error_text", "created_at", "summary",
  "default_direction",
]
visible = [
  "id", "name", "status", "target_session", "session_status", "direction", "sent_messages",
  "selected_messages", "total_messages", "pairs", "first_time", "last_time", "speed", "max_gap",
  "time_from", "time_to", "msg_filter", "file_path", "error_text",
]
sort = "-id"

  [panes.replay-control.labels]
  id = "ID"
  name = "Name"
  status = "Status"
  target_session = "Session"
  session_status = "Session Status"
  direction = "Direction"
  sent_messages = "Sent"
  selected_messages = "Selected"
  total_messages = "In File"
  pairs = "CompID Pairs"
  first_time = "First"
  last_time = "Last"
  speed = "Speed"
  max_gap = "Max Gap"
  time_from = "From"
  time_to = "To"
  msg_filter = "Types"
  file_path = "File"
  error_text = "Error"
  created_at = "Created"
  summary = "Summary"
  default_direction = "Default Direction"

  [[panes.replay-control.groups]]
  label = "Job"
  columns = ["id", "name", "file_path", "summary"]

  [[panes.replay-control.groups]]
  label = "Session"
  columns = ["target_session", "session_status", "direction", "default_direction"]

  [[panes.replay-control.groups]]
  label = "Progress"
  columns = ["sent_messages", "selected_messages", "total_messages", "pairs"]

  [[panes.replay-control.groups]]
  label = "Filter"
  columns = ["time_from", "time_to", "msg_filter"]

  [[panes.replay-control.groups]]
  label = "Playback"
  columns = ["speed", "max_gap"]

  [[panes.replay-control.groups]]
  label = "Status"
  columns = ["status", "error_text"]

  [[panes.replay-control.groups]]
  label = "Times"
  columns = ["first_time", "last_time", "created_at"]

  [panes.replay-control.types]

    [panes.replay-control.types.first_time]
    type = "time"
    parse = "%Y%m%d-%H:%M:%S.%f"
    format = "%Y-%m-%d %H:%M:%S.%f %Z"
    zone = "local"

    [panes.replay-control.types.last_time]
    type = "time"
    parse = "%Y%m%d-%H:%M:%S.%f"
    format = "%Y-%m-%d %H:%M:%S.%f %Z"
    zone = "local"

    [panes.replay-control.types.created_at]
    type = "time"
    parse = "%Y%m%d-%H:%M:%S.%f"
    format = "%Y-%m-%d %H:%M:%S.%f %Z"
    zone = "local"

  [panes.replay-control.styles]
  status = [
    { when = "value == 'running'", color = "#4ec9b0", bold = true },
    { when = "value == 'paused'", color = "#dcdcaa", bold = true },
    { when = "value == 'error'", color = "#f44747", bold = true },
    { when = "value == 'completed'", color = "#4ec9b0" },
    { when = "value == 'stopped'", color = "#858585" },
  ]
  session_status = [
    { when = "value == 'ACTIVE'", color = "#4ec9b0" },
    { when = "value == 'ERROR'", color = "#f44747" },
  ]

  [[panes.replay-control.buttons]]
  label = "Load…"
  enable = { connected = true }

    [panes.replay-control.buttons.action]
    type = "dialog"

      [panes.replay-control.buttons.action.dialog]
      title = "Load a FIX log"
      width = 480
      submit = { label = "Load", service = "fix_cmd", op = "load_replay" }

        [[panes.replay-control.buttons.action.dialog.fields]]
        name = "example"
        label = "Bundled example"
        type = "select"
        value = ""

          [[panes.replay-control.buttons.action.dialog.fields.options]]
          value = ""
          label = "(a file on the server: give its path below)"

          [[panes.replay-control.buttons.action.dialog.fields.options]]
          value = "iso-timestamped"
          label = "iso-timestamped — Three client messages with ISO-8601 timestamps"

          [[panes.replay-control.buttons.action.dialog.fields.options]]
          value = "order-flow"
          label = "order-flow — Six order messages, one direction, no header"

          [[panes.replay-control.buttons.action.dialog.fields.options]]
          value = "pipe-raw"
          label = "pipe-raw — Three client messages, pipe-delimited, no timestamp prefix"

          [[panes.replay-control.buttons.action.dialog.fields.options]]
          value = "soh-raw"
          label = "soh-raw — Three client messages, SOH-delimited, no timestamp prefix"

          [[panes.replay-control.buttons.action.dialog.fields.options]]
          value = "two-sided-day"
          label = "two-sided-day — A day between a client and a venue, both directions"

        [[panes.replay-control.buttons.action.dialog.fields]]
        name = "file_path"
        label = "File path on the server"
        type = "text"
        value = ""
        placeholder = "/path/to/fix.log — ignored when an example is picked"

        [[panes.replay-control.buttons.action.dialog.fields]]
        name = "name"
        label = "Job name"
        type = "text"
        value = ""
        placeholder = "blank = the file's name"

        [[panes.replay-control.buttons.action.dialog.fields]]
        type = "readonly"
        value = "The whole file is read once: its CompID pairs, message types and time span become the job's summary. Raw SOH or pipe lines, QuickFIX and ISO-timestamped logs are recognised; logons, heartbeats and the other admin messages are left out."

  [[panes.replay-control.buttons]]
  label = "Configure…"
  unit = "row"

    [panes.replay-control.buttons.enable]
    connected = true
    when = "ALL(rows, r -> not CONTAINS(['running', 'paused'], r.status))"

    [panes.replay-control.buttons.action]
    type = "dialog"

      [panes.replay-control.buttons.action.dialog]
      title = "Configure ${row.name}"
      width = 480
      submit = { label = "Save", service = "fix_cmd", op = "configure_replay" }

        [[panes.replay-control.buttons.action.dialog.fields]]
        name = "job_id"
        type = "hidden"
        value = "${row.id}"

        [[panes.replay-control.buttons.action.dialog.fields]]
        name = "target_session"
        label = "Session to replay into"
        type = "select"
        value = "${row.target_session}"
        required = true

          [panes.replay-control.buttons.action.dialog.fields.optionsFrom]
          service = "sessions_list"
          value = "session_id"
          label = "session_id"
          empty = "(choose a session)"

        [[panes.replay-control.buttons.action.dialog.fields]]

          [[panes.replay-control.buttons.action.dialog.fields.row]]
          name = "speed"
          label = "Speed (× log time; 0 = no delay)"
          type = "number"
          value = "${row.speed}"
          min = 0
          step = "any"
          width = 0.5

          [[panes.replay-control.buttons.action.dialog.fields.row]]
          name = "max_gap"
          label = "Max gap between messages (s)"
          type = "number"
          value = "${row.max_gap}"
          min = 0
          step = "any"
          width = 0.5

        [[panes.replay-control.buttons.action.dialog.fields]]

          [[panes.replay-control.buttons.action.dialog.fields.row]]
          name = "time_from"
          label = "From (HH:MM[:SS], blank = start)"
          type = "text"
          value = "${row.time_from}"
          placeholder = "${row.first_time}"
          width = 0.5

          [[panes.replay-control.buttons.action.dialog.fields.row]]
          name = "time_to"
          label = "To (HH:MM[:SS], blank = end)"
          type = "text"
          value = "${row.time_to}"
          placeholder = "${row.last_time}"
          width = 0.5

        [[panes.replay-control.buttons.action.dialog.fields]]
        name = "msg_filter"
        label = "Message types to replay"
        type = "checklist"
        size = 8
        all = "Every type in the file"
        none = "The file holds no application messages"
        value = "${row.msg_filter}"
        required = true
        invalidMessage = "Tick at least one type"

          [panes.replay-control.buttons.action.dialog.fields.optionsFrom]
          service = "replay_types"
          params = { job_id = "${row.id}" }
          value = "value"
          label = "label"

        [[panes.replay-control.buttons.action.dialog.fields]]
        type = "readonly"
        value = "Speed scales the gaps between the log's timestamps; a gap longer than the maximum is cut to it (a lunch break, the overnight). The window is by the log's time of day."

  [[panes.replay-control.buttons]]
  label = "Start…"
  unit = "row"

    [panes.replay-control.buttons.enable]
    connected = true
    when = "ALL(rows, r -> not CONTAINS(['running', 'paused'], r.status) and r.target_session != '' and r.session_status == 'ACTIVE')"

    [panes.replay-control.buttons.action]
    type = "dialog"

      [panes.replay-control.buttons.action.dialog]
      title = "Start ${row.name}"
      width = 440
      submit = { label = "Start", service = "fix_cmd", op = "start_replay" }

        [[panes.replay-control.buttons.action.dialog.fields]]
        name = "job_id"
        type = "hidden"
        value = "${row.id}"

        [[panes.replay-control.buttons.action.dialog.fields]]
        label = "Into session"
        type = "readonly"
        value = "${row.target_session}"

        [[panes.replay-control.buttons.action.dialog.fields]]
        name = "direction"
        label = "Direction (the log's sender → target to play)"
        type = "select"
        value = "${row.default_direction}"
        required = true

          [panes.replay-control.buttons.action.dialog.fields.optionsFrom]
          service = "replay_directions"
          params = { job_id = "${row.id}" }
          value = "value"
          label = "label"
          empty = "(choose a direction)"

        [[panes.replay-control.buttons.action.dialog.fields]]
        type = "readonly"
        value = "Sent as ${row.target_session}: its CompIDs, sequence numbers, SendingTime and TransactTime replace the log's; every other tag goes out as logged, routing tags and repeating groups included. Types: ${row.msg_filter}."

  [[panes.replay-control.buttons]]
  label = "Pause"
  enable = { connected = true, minSelected = 1, when = "ALL(rows, r -> r.status == 'running')" }

    [panes.replay-control.buttons.action]
    type = "transaction"
    service = "fix_cmd"
    op = "pause_replay"
    data = { job_id = "${row.id}" }

  [[panes.replay-control.buttons]]
  label = "Resume"
  enable = { connected = true, minSelected = 1, when = "ALL(rows, r -> r.status == 'paused')" }

    [panes.replay-control.buttons.action]
    type = "transaction"
    service = "fix_cmd"
    op = "resume_replay"
    data = { job_id = "${row.id}" }

  [[panes.replay-control.buttons]]
  label = "Stop"

    [panes.replay-control.buttons.enable]
    connected = true
    minSelected = 1
    when = "ALL(rows, r -> CONTAINS(['running', 'paused'], r.status))"

    [panes.replay-control.buttons.action]
    type = "transaction"
    service = "fix_cmd"
    op = "stop_replay"
    data = { job_id = "${row.id}" }

  [[panes.replay-control.buttons]]
  label = "Delete"

    [panes.replay-control.buttons.enable]
    connected = true
    minSelected = 1
    when = "ALL(rows, r -> not CONTAINS(['running', 'paused'], r.status))"

    [panes.replay-control.buttons.action]
    type = "transaction"
    service = "fix_cmd"
    op = "delete_replay"
    data = { job_id = "${row.id}" }

