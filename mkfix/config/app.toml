[dialogs.stop_recording]
title = "Stop recording the ${row.side} side"
width = 380

  [dialogs.stop_recording.submit]
  label = "Stop and save"
  service = "fix_cmd"
  op = "record_stop"
  then = { action = "macro.recorded", args = { side = "${row.side}", name = "${name}" } }

  [[dialogs.stop_recording.fields]]
  name = "side"
  type = "hidden"
  value = "${row.side}"

  [[dialogs.stop_recording.fields]]
  name = "save"
  type = "hidden"
  value = "1"

  [[dialogs.stop_recording.fields]]
  name = "name"
  label = "Save the macro as"
  type = "text"
  required = true
  value = "${row.name}"

  [[dialogs.stop_recording.fields]]
  name = "delays"
  label = "Keep my delays"
  type = "checkbox"
  value = false

  [[dialogs.stop_recording.fields]]
  type = "readonly"
  showWhen = "not delays"
  value = "Each action will run the moment what it answered comes. Time is written only where nothing came between two of your actions."

  [[dialogs.stop_recording.fields]]
  type = "readonly"
  showWhen = "delays"
  value = "Each action will also wait the time you took to answer — a venue with a person's pauses."

  [[dialogs.stop_recording.fields]]
  type = "readonly"
  value = "The macro opens in ${row.Side} Macros. If the name is taken the recording goes on; if nothing was recorded, nothing is saved."

