[panes.quote-blotter]
title = "Received Quotes"
type = "mkio-table"
service = "rfqs_query"
protocol = "query"
filter = "direction == 'RX' && origin == 'quote'"
columns = [
  "quote_id", "quote_ref_id", "session_id", "client", "symbol", "instrument", "security_type",
  "maturity", "strike_price", "put_or_call", "cfi_code", "underlying_symbol",
  "underlying_security_type", "underlying_maturity", "multiplier", "security_exchange",
  "security_id", "security_id_source", "side", "order_qty", "status", "bid_size", "bid_px",
  "offer_px", "offer_size", "valid_until", "quote_type", "pending_action", "order_cl_ord_id",
  "text", "sent_text", "quote_extra_tags", "macro", "updated_at", "id", "origin", "quote_req_id",
  "rfq_req_id", "side_code", "quote_request_type", "quote_request_type_code", "quote_type_code",
  "currency", "quote_status", "quote_status_code", "rej_reason", "rej_reason_code", "quote_resp_id",
  "quote_resp_type", "quote_resp_type_code", "pending_resp_id", "pending_bid_px",
