  [[dialogs.shortcuts.facts]]
  label = "Ctrl/Cmd+A"
  value = "Select every row"

  [[dialogs.shortcuts.facts]]
  label = "Ctrl/Cmd+F"
  value = "Find in the focused table"

  [[dialogs.shortcuts.facts]]
  label = "Ctrl/Cmd+G"
  value = "Next match (Shift for the previous one)"

  [[dialogs.shortcuts.facts]]
  label = "Escape"
  value = "Clear the selection, then close find; in a dialog, cancel it unless it is pinned"

  [[dialogs.shortcuts.facts]]
  label = "Enter"
  value = "Submit a dialog from a single-line field"

  [[dialogs.shortcuts.facts]]
  label = "Ctrl/Cmd+Enter"
  value = "Submit a dialog from anywhere in it"

  [[dialogs.shortcuts.facts]]
  label = "Shift while dragging a window"
  value = "A move snaps to other windows' edges; a resize, which snaps by itself, goes free"

  [[dialogs.shortcuts.facts]]
  label = "Alt/Option+Shift+←/→"
  value = "Move the active tab left or right in its window"
  showWhen = "not state.focus.sloppy"

  [[dialogs.shortcuts.facts]]
  label = "Sloppy focus"
  value = "Off. Hold Shift as you open the Window menu to turn it on"
  showWhen = "not state.focus.sloppy"

  [[dialogs.shortcuts.facts]]
  label = "Sloppy focus"
  value = "On: the focus follows the pointer without bringing a window forward. Hold Shift as you open the Window menu to turn it off"
  showWhen = "state.focus.sloppy"

  [[dialogs.shortcuts.facts]]
  label = "Click a title bar"
  value = "Bring the window to the front (a drag moves it where it is)"
  showWhen = "state.focus.sloppy"

  [[dialogs.shortcuts.facts]]
  label = "Click in a window"
  value = "Focus it, where it is"
  showWhen = "state.focus.sloppy"

  [[dialogs.shortcuts.facts]]
  label = "Alt/Option-click"
  value = "Bring the window to the front"
  showWhen = "state.focus.sloppy and state.focus.windowClick != 'ctrl+alt'"

  [[dialogs.shortcuts.facts]]
  label = "Shift+Alt/Option-click"
  value = "Send the window to the back"
  showWhen = "state.focus.sloppy and state.focus.windowClick != 'ctrl+alt'"

  [[dialogs.shortcuts.facts]]
  label = "Alt/Option-drag"
  value = "Move the window from anywhere in it"
  showWhen = "state.focus.sloppy and state.focus.windowClick != 'ctrl+alt'"

  [[dialogs.shortcuts.facts]]
  label = "Ctrl+Alt-click"
  value = "Bring the window to the front"
  showWhen = "state.focus.sloppy and state.focus.windowClick == 'ctrl+alt'"

  [[dialogs.shortcuts.facts]]
  label = "Shift+Ctrl+Alt-click"
  value = "Send the window to the back"
  showWhen = "state.focus.sloppy and state.focus.windowClick == 'ctrl+alt'"

  [[dialogs.shortcuts.facts]]
  label = "Ctrl+Alt-drag"
  value = "Move the window from anywhere in it"
  showWhen = "state.focus.sloppy and state.focus.windowClick == 'ctrl+alt'"

  [[dialogs.shortcuts.facts]]
  label = "Alt/Option+P"
  value = "Bring the focused window to the front"
  showWhen = "state.focus.sloppy"

  [[dialogs.shortcuts.facts]]
  label = "Alt/Option+N"
  value = "Send it to the back"
  showWhen = "state.focus.sloppy"

  [[dialogs.shortcuts.facts]]
  label = "Alt/Option+H/J/K/L or arrows"
  value = "Move a stand-in mouse pointer; the focus follows it"
  showWhen = "state.focus.sloppy"

  [[dialogs.shortcuts.facts]]
  label = "Alt/Option+Shift+H/J/K/L or arrows"
  value = "Move the focused window"
  showWhen = "state.focus.sloppy"

  [[dialogs.shortcuts.facts]]
  label = "Alt/Option+Ctrl+H/J/K/L or arrows"
  value = "Size the focused window by its bottom-right corner (L/J grow, H/K shrink); Shift too sizes it freely"
  showWhen = "state.focus.sloppy"

  [[dialogs.shortcuts.buttons]]
  id = "guide"
  label = "User Guide"
  action = "pane.show"
  args = "help-guide"
  set = { help_target = { page = "user-guide", anchor = "sloppy-focus" } }

  [[dialogs.shortcuts.buttons]]
  id = "ok"
  label = "OK"
  kind = "primary"
  cancel = true
  default = true

[dialogs.arm_macro]
title = "Arm ${row.name}"
width = 340
submit = { label = "Arm", service = "fix_cmd", op = "arm_macro" }

  [[dialogs.arm_macro.fields]]
  name = "name"
  type = "hidden"
  value = "${row.name}"

  [[dialogs.arm_macro.fields]]
  name = "side"
  type = "hidden"
  value = "${row.side}"

  [[dialogs.arm_macro.fields]]
  name = "session"
  label = "Only this session's"
  type = "select"
  value = ""

    [dialogs.arm_macro.fields.optionsFrom]
    service = "sessions_list"
    value = "session_id"
    label = "session_id"
    empty = "(any session)"

  [[dialogs.arm_macro.fields]]

    [[dialogs.arm_macro.fields.row]]
    name = "speed"
    label = "Speed"
    type = "number"
    value = 1
    min = 0.01
    step = "any"
    width = 0.5

    [[dialogs.arm_macro.fields.row]]
    name = "seed"
    label = "Seed (blank: the macro's, or random)"
    type = "text"
    value = ""
    width = 0.5

