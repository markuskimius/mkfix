  "underlying_symbol", "underlying_security_type", "underlying_maturity", "multiplier",
  "security_exchange", "security_id", "security_id_source", "open_close", "covered_uncovered",
  "side", "last_qty", "last_price", "cum_qty", "avg_price", "exec_type", "dk_reason", "dk_text",
