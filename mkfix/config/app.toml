  leg_qty = "Leg Qty"
  cum_qty = "Cum Qty"
  avg_price = "Avg Px"
  last_qty = "Last Qty"
  last_price = "Last Px (637)"
  created_at = "Created"
  updated_at = "Updated"

  [[panes.received-legs.groups]]
  label = "IDs"
  columns = ["order_id", "cl_ord_id", "seq", "leg_ref_id"]

  [[panes.received-legs.groups]]
  label = "Session"
  columns = ["session_id"]

  [[panes.received-legs.groups]]
  label = "Instrument"
  columns = [
    "symbol", "instrument", "security_type", "cfi_code", "security_exchange", "security_id",
    "security_id_source",
  ]

  [[panes.received-legs.groups]]
  label = "Derivative"
  columns = ["maturity", "strike_price", "put_or_call", "multiplier", "position_effect", "covered"]

  [[panes.received-legs.groups]]
  label = "Terms"
  columns = ["ratio", "side", "leg_price", "leg_qty"]

  [[panes.received-legs.groups]]
  label = "Status"
  columns = ["cum_qty", "avg_price", "last_qty", "last_price"]

  [[panes.received-legs.groups]]
  label = "Times"
  columns = ["created_at", "updated_at"]

  [[panes.received-legs.groups]]
  label = "Internal"
  columns = ["id", "direction", "side_code"]

  [panes.received-legs.types]

    [panes.received-legs.types.created_at]
    type = "time"
    parse = "%Y%m%d-%H:%M:%S.%f"
    format = "%Y-%m-%d %H:%M:%S.%f %Z"
    zone = "local"

    [panes.received-legs.types.updated_at]
    type = "time"
    parse = "%Y%m%d-%H:%M:%S.%f"
    format = "%Y-%m-%d %H:%M:%S.%f %Z"
    zone = "local"

  [panes.received-legs.styles]

    [[panes.received-legs.styles.side]]
    when = "value == 'Buy'"
    color = "#4ec9b0"

    [[panes.received-legs.styles.side]]
    when = "CONTAINS(['Sell', 'SellShort', 'SellShortExempt', 'SellPlus'], value)"
    color = "#f44747"

