[panes.market-rfq-blotter]
title = "Received RFQs"
type = "mkio-table"
service = "rfqs_query"
protocol = "query"
filter = "direction == 'RX' && origin == 'rfq'"
columns = [
  "quote_req_id", "rfq_req_id", "session_id", "client", "symbol", "instrument", "security_type",
  "maturity", "strike_price", "put_or_call", "cfi_code", "underlying_symbol",
  "underlying_security_type", "underlying_maturity", "multiplier", "security_exchange",
  "security_id", "security_id_source", "side", "order_qty", "status", "quote_id", "bid_size",
  "bid_px", "offer_px", "offer_size", "valid_until", "quote_type", "pending_action",
  "pending_bid_px", "pending_offer_px", "rej_reason", "order_cl_ord_id", "text", "sent_text",
  "extra_tags", "macro", "updated_at", "id", "origin", "side_code", "quote_request_type",
  "quote_request_type_code", "quote_type_code", "currency", "quote_ref_id", "quote_status",
  "quote_status_code", "rej_reason_code", "quote_resp_id", "quote_resp_type",
  "quote_resp_type_code", "pending_resp_id", "pending_bid_size", "pending_offer_size",
  "pending_extra_tags", "quote_extra_tags", "transact_time", "timestamp", "direction",
  "raw_message", "session_status",
]
visible = [
  "quote_req_id", "session_id", "client", "instrument", "side", "order_qty", "status", "quote_id",
  "bid_size", "bid_px", "offer_px", "offer_size", "valid_until", "quote_type", "pending_action",
  "pending_bid_px", "pending_offer_px", "rej_reason", "order_cl_ord_id", "text", "sent_text",
  "extra_tags", "macro", "updated_at",
]
filters = { updated_at = { preset = "today" } }
display = { raw_message = "${REPLACE(value, '\\u{1}', '|')}" }

  [panes.market-rfq-blotter.history]
  table = "fix_rfqs"
  key = ["id"]
  versions = "rfqs_versions"
  state = "rfqs_state"
  feed = "rfqs_history"
