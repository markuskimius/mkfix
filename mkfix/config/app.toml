[panes.rfq-request-blotter]
title = "Received RFQ Requests"
type = "mkio-table"
service = "rfq_requests_query"
protocol = "query"
filter = "direction == 'RX'"
columns = [
  "rfq_req_id", "session_id", "client", "symbols", "num_symbols", "subscription_type", "status",
  "quote_requests", "last_quote_req_id", "quote_request_type", "quote_type", "extra_tags", "macro",
  "updated_at", "id", "quote_request_type_code", "quote_type_code", "subscription_type_code",
  "timestamp", "direction", "raw_message", "session_status", "instruments", "instrument_terms",
  "instrument_names",
]
visible = [
  "rfq_req_id", "session_id", "client", "symbols", "instruments", "num_symbols",
  "subscription_type", "status", "quote_requests", "last_quote_req_id", "quote_request_type",
  "quote_type", "extra_tags", "macro", "updated_at",
]
filters = { updated_at = { preset = "today" } }
display = { raw_message = "${REPLACE(value, '\\u{1}', '|')}" }

  [panes.rfq-request-blotter.history]
  table = "fix_rfq_requests"
  key = ["id"]
  versions = "rfq_requests_versions"
  state = "rfq_requests_state"
  feed = "rfq_requests_history"
  asOf = "received_rfq_requests_as_of"
  columns = [
    "rfq_req_id", "symbols", "num_symbols", "subscription_type", "status", "quote_requests",
    "last_quote_req_id", "quote_request_type", "quote_type", "extra_tags",
  ]

  [panes.rfq-request-blotter.labels]
  rfq_req_id = "RFQReqID"
  session_id = "Session"
  client = "Client"
  symbols = "Symbols"
  num_symbols = "Count"
  subscription_type = "Subscription"
  status = "Status"
  quote_requests = "RFQs"
  last_quote_req_id = "Last QuoteReqID"
  quote_request_type = "Request Type"
  quote_type = "Quote Type"
  extra_tags = "Extra Tags"
  macro = "Macro"
  updated_at = "Updated"
  id = "Row"
  quote_request_type_code = "Request Type (303)"
  quote_type_code = "Quote Type (537)"
  subscription_type_code = "Subscription (263)"
  timestamp = "Opened"
  direction = "Dir"
  raw_message = "Message"
  session_status = "Session Status"
  instruments = "Instruments"
  instrument_terms = "Instrument Terms"
  instrument_names = "Instrument Names"

  [[panes.rfq-request-blotter.groups]]
  label = "IDs"
  columns = ["rfq_req_id", "last_quote_req_id"]

  [[panes.rfq-request-blotter.groups]]
  label = "Session"
  columns = ["session_id", "client", "session_status"]

  [[panes.rfq-request-blotter.groups]]
  label = "Request"
  columns = [
    "instruments", "symbols", "num_symbols", "instrument_names", "subscription_type",
    "quote_request_type", "quote_type",
  ]

  [[panes.rfq-request-blotter.groups]]
  label = "Status"
  columns = ["status", "quote_requests"]

  [[panes.rfq-request-blotter.groups]]
  label = "Text & Tags"
  columns = ["extra_tags", "macro"]

  [[panes.rfq-request-blotter.groups]]
  label = "Times"
  columns = ["updated_at", "timestamp"]

  [[panes.rfq-request-blotter.groups]]
  label = "Internal"
  columns = [
    "id", "direction", "quote_request_type_code", "quote_type_code", "subscription_type_code",
    "instrument_terms", "raw_message",
  ]

  [panes.rfq-request-blotter.types]

    [panes.rfq-request-blotter.types.timestamp]
    type = "time"
    parse = "%Y%m%d-%H:%M:%S.%f"
    format = "%Y-%m-%d %H:%M:%S.%f %Z"
    zone = "local"

    [panes.rfq-request-blotter.types.updated_at]
    type = "time"
    parse = "%Y%m%d-%H:%M:%S.%f"
    format = "%Y-%m-%d %H:%M:%S.%f %Z"
    zone = "local"

