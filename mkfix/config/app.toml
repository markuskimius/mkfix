[panes.client-macro-runs]
title = "Client Macro Runs"
type = "mkio-table"
service = "macro_runs_tree"
protocol = "query"
filter = "side == 'client'"
tree = { child = "parent_key", parent = "key", expand = 1, flat = "leaves" }
select = { state = "selected_macro_order" }
link = { broadcast = { client_macro_run = "run_id", client_macro_order = "order_row" } }
columns = [
  "run_id", "macro", "status", "subject", "cl_ord_id", "symbol", "session", "market_session",
  "line", "waiting_for", "message", "actions", "priority", "verdict", "orders", "live", "passed",
  "failed", "speed", "seed", "version", "started_at", "ended_at", "updated_at", "id", "side",
  "kind", "key", "parent_key", "order_row", "order_id",
]
visible = [
  "run_id", "macro", "status", "verdict", "subject", "cl_ord_id", "symbol", "message", "orders",
  "live", "passed", "failed", "started_at",
]
filters = { started_at = { preset = "today" } }
sort = ["-id"]
rowStyle = [{ when = "kind == 'order'", italic = true }]

  [panes.client-macro-runs.labels]
  run_id = "Run"
  macro = "Macro"
  status = "Status"
  cl_ord_id = "ID"
  symbol = "Symbol"
  session = "Session"
  line = "Line"
  waiting_for = "Waiting For"
  message = "Message"
  actions = "Actions"
  priority = "Priority"
  verdict = "Verdict"
  orders = "Orders"
  live = "Live"
  passed = "Passed"
  failed = "Failed"
  speed = "Speed"
  seed = "Seed"
  version = "Macro Ver"
  started_at = "Started"
  ended_at = "Ended"
  updated_at = "Updated"
  order_id = "Order ID"
  id = "Row"
  side = "Side"
  kind = "Kind"
  key = "Key"
  parent_key = "Parent Key"
  order_row = "Order Row"
  subject = "Subject"
  market_session = "Market Session"

  [[panes.client-macro-runs.groups]]
  label = "Run"
  columns = [
    "run_id", "macro", "status", "session", "market_session", "priority", "verdict", "orders",
    "live", "passed", "failed", "speed", "seed", "version", "started_at", "ended_at",
  ]

  [[panes.client-macro-runs.groups]]
  label = "Order"
  columns = [
    "subject", "cl_ord_id", "symbol", "line", "waiting_for", "message", "actions", "order_id",
    "updated_at",
  ]

  [[panes.client-macro-runs.groups]]
  label = "Internal"
  columns = ["id", "side", "kind", "key", "parent_key", "order_row"]

  [panes.client-macro-runs.types]

    [panes.client-macro-runs.types.started_at]
    type = "time"
    parse = "%Y%m%d-%H:%M:%S.%f"
    format = "%Y-%m-%d %H:%M:%S.%f %Z"
    zone = "local"

    [panes.client-macro-runs.types.ended_at]
    type = "time"
    parse = "%Y%m%d-%H:%M:%S.%f"
    format = "%Y-%m-%d %H:%M:%S.%f %Z"
    zone = "local"

    [panes.client-macro-runs.types.updated_at]
    type = "time"
    parse = "%Y%m%d-%H:%M:%S.%f"
    format = "%Y-%m-%d %H:%M:%S.%f %Z"
    zone = "local"

  [panes.client-macro-runs.styles]
  status = [
    { when = "value == 'armed'", color = "#4ec9b0", bold = true },
    { when = "CONTAINS(['running', 'listening'], value)", color = "#4ec9b0" },
    { when = "value == 'paused'", color = "#dcdcaa" },
    { when = "value == 'passed'", color = "#6a9955", bold = true },
    { when = "value == 'failed'", color = "#f44747", bold = true },
    { when = "value == 'interrupted'", color = "#ce9178" },
    { when = "CONTAINS(['stopped', 'detached', 'completed'], value)", color = "#858585" },
  ]
  verdict = [
    { when = "value == 'passed'", color = "#6a9955", bold = true },
    { when = "value == 'failed'", color = "#f44747", bold = true },
  ]
  priority = [{ when = "value == 0", color = "transparent" }]

  [[panes.client-macro-runs.buttons]]
  label = "Pause"

    [panes.client-macro-runs.buttons.enable]
    connected = true
    minSelected = 1
    when = "ALL(rows, r -> r.kind == 'run' and r.status == 'armed')"

    [panes.client-macro-runs.buttons.action]
    type = "transaction"
    service = "fix_cmd"
    op = "pause_run"
    data = { run_id = "${row.run_id}" }

  [[panes.client-macro-runs.buttons]]
  label = "Resume"

    [panes.client-macro-runs.buttons.enable]
    connected = true
    minSelected = 1
    when = "ALL(rows, r -> r.kind == 'run' and r.status == 'paused')"

    [panes.client-macro-runs.buttons.action]
    type = "transaction"
    service = "fix_cmd"
    op = "resume_run"
    data = { run_id = "${row.run_id}" }

  [[panes.client-macro-runs.buttons]]
  label = "Stop"

    [panes.client-macro-runs.buttons.enable]
    connected = true
    minSelected = 1
    when = "ALL(rows, r -> r.kind == 'run' and CONTAINS(['armed', 'paused'], r.status))"

    [panes.client-macro-runs.buttons.action]
    type = "transaction"
    service = "fix_cmd"
    op = "stop_run"
    data = { run_id = "${row.run_id}" }

  [[panes.client-macro-runs.buttons]]
  label = "Move Up"

    [panes.client-macro-runs.buttons.enable]
    connected = true
    minSelected = 1
    maxSelected = 1
    when = "ALL(rows, r -> r.kind == 'run' and r.status == 'armed' and r.priority > 0)"

    [panes.client-macro-runs.buttons.action]
    type = "transaction"
    service = "fix_cmd"
    op = "move_run"
    data = { run_id = "${row.run_id}", direction = "up" }

  [[panes.client-macro-runs.buttons]]
  label = "Move Down"

    [panes.client-macro-runs.buttons.enable]
    connected = true
    minSelected = 1
    maxSelected = 1
    when = "ALL(rows, r -> r.kind == 'run' and r.status == 'armed' and r.priority > 0)"

    [panes.client-macro-runs.buttons.action]
    type = "transaction"
    service = "fix_cmd"
    op = "move_run"
    data = { run_id = "${row.run_id}", direction = "down" }

  [[panes.client-macro-runs.buttons]]
  label = "Detach"

    [panes.client-macro-runs.buttons.enable]
    connected = true
    minSelected = 1
    when = "ALL(rows, r -> r.kind == 'order' and CONTAINS(['running', 'listening'], r.status))"

    [panes.client-macro-runs.buttons.action]
    type = "transaction"
    service = "fix_cmd"
    op = "detach_order"
    data = { order_row = "${row.order_row}", subject = "${row.subject}" }

