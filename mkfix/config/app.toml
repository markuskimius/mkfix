# ─── mkio Connection ──────────────────────────────────────────────

[mkio]
url = "auto"
expect = { name = "mkfix", version = "0.90", mkio = "1.5", expr = "2" }
connected = { "status.message" = "Connected", "status.color" = "", "status.background" = "" }

  [mkio.disconnected]
  "status.message" = "Disconnected"
  "status.color" = "#000"
  "status.background" = "#858585"

  [mkio.incompatible]
  "status.message" = "Server version mismatch"
  "status.color" = "#fff"
  "status.background" = "#cc0000"
