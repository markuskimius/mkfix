    zone = "local"

    [panes.ioi-blotter.types.transact_time]
    type = "time"
    parse = "%Y%m%d-%H:%M:%S.%f"
    format = "%Y-%m-%d %H:%M:%S.%f %Z"
    zone = "local"

    [panes.ioi-blotter.types.timestamp]
    type = "time"
