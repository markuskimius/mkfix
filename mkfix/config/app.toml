[panes.market-list-blotter]
title = "Received Lists"
type = "mkio-table"
service = "lists_query"
protocol = "query"
filter = "direction == 'RX'"
columns = [
  "list_id", "session_id", "client", "mode", "status", "orders", "done_orders", "pending_orders",
  "filled_qty", "order_count", "tot_no_orders", "pending_action", "status_type", "bid_type",
  "exec_inst_type", "text", "sent_text", "extra_tags", "macro", "last_order_at", "created_at",
  "updated_at", "id", "direction", "bid_type_code", "exec_inst_type_code", "status_type_code",
  "list_status_code", "pending_extra_tags", "raw_message", "session_status", "list_orders",
]
visible = [
  "list_id", "session_id", "client", "mode", "status", "orders", "done_orders", "pending_orders",
  "filled_qty", "tot_no_orders", "pending_action", "text", "last_order_at", "updated_at",
]
filters = { updated_at = { preset = "today" } }
display = { raw_message = "${REPLACE(value, '\\u{1}', '|')}" }
link = { broadcast = { received_list = "list_id" }, chips = false }

