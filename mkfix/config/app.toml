[panes.raw-messages]
title = "Messages"
type = "mkio-table"
service = "messages_stream"
protocol = "stream"
start = "today"
live = true
columns = [
  "timestamp", "direction", "seq_num", "session_id", "msg_type_name", "client", "raw_message", "id",
  "msg_type", "category", "sender_comp", "target_comp", "cl_ord_id", "order_id", "exec_id",
  "symbol", "side", "body_length", "checksum",
]
