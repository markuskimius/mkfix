# ─── Saved Layouts ────────────────────────────────────────────────

[layouts]
key = "mkfix"
keep = 10
keepDays = 7

# ─── Statusbar ────────────────────────────────────────────────────

[statusbar]
left = [{ type = "text", bind = "status.message" }]
right = [{ type = "macro-status" }, { type = "text", text = "mkfix v0.90" }]
bindStyle = { color = "status.color", background = "status.background" }

# ─── Panes ────────────────────────────────────────────────────────

[panes]
message-detail = { title = "Detail", type = "message-detail" }
dictionaries = { title = "Dictionaries", type = "dictionaries" }
client-macros = { title = "Client Macros", type = "macros", side = "client" }
market-macros = { title = "Market Macros", type = "macros", side = "market" }
end-to-end-macros = { title = "End-to-end Macros", type = "macros", side = "end-to-end" }
help-guide = { title = "Help", type = "help-viewer", page = "user-guide" }
help-viewer = { title = "Help", type = "help-viewer", page = "macro-language" }
help-replay = { title = "Help", type = "help-viewer", page = "replaying-a-log" }

[panes.session-blotter]
title = "Sessions"
type = "mkio-table"
service = "sessions_query"
protocol = "query"
columns = [
  "session_id", "fix_version", "dictionary", "client_tags", "sender_comp_id", "target_comp_id",
  "host", "port", "status", "tx_seq_num", "rx_seq_num", "error_text", "timestamp_precision",
  "heartbeat_interval", "logout_timeout", "logout_test_request", "reset_on_logon", "enabled",
  "description", "session_start", "last_tx_time", "last_rx_time",
]
visible = [
  "session_id", "fix_version", "dictionary", "client_tags", "sender_comp_id", "target_comp_id",
  "host", "port", "status", "tx_seq_num", "rx_seq_num", "error_text",
]
select = { state = "selected_session" }

  [panes.session-blotter.history]
  table = "fix_sessions"
  key = ["session_id"]
  versions = "sessions_versions"
  state = "sessions_state"
  feed = "sessions_history"
  asOf = "sessions_as_of"
  undo = { service = "session_mgmt", op = "undo" }
  redo = { service = "session_mgmt", op = "redo" }
  confirm = true

  [panes.session-blotter.labels]
  session_id = "Session"
  fix_version = "Version"
  sender_comp_id = "Sender"
  target_comp_id = "Target"
  host = "Host"
  port = "Port"
  status = "Status"
  tx_seq_num = "TX Seq"
  rx_seq_num = "RX Seq"
  dictionary = "Dictionary"
  _mkio_version = "Ver"
  error_text = "Error"
  client_tags = "Client Tags"
  timestamp_precision = "Timestamps"
  heartbeat_interval = "Heartbeat"
  logout_timeout = "Logout Timeout"
  logout_test_request = "Logout TestReq"
  reset_on_logon = "Reset on Logon"
  enabled = "Enabled"
  description = "Description"
  session_start = "Started"
  last_tx_time = "Last TX"
  last_rx_time = "Last RX"

