  "pending_offer_px", "order_cl_ord_id", "sent_text", "text", "quote_extra_tags", "macro",
  "updated_at", "id", "origin", "quote_req_id", "rfq_req_id", "side_code", "quote_request_type",
  "quote_request_type_code", "quote_type_code", "currency", "quote_status", "quote_status_code",
  "rej_reason", "rej_reason_code", "quote_resp_id", "quote_resp_type", "quote_resp_type_code",
  "pending_resp_id", "pending_bid_size", "pending_offer_size", "pending_extra_tags", "extra_tags",
