    [panes.market-allocation-blotter.types.transact_time]
    type = "time"
    parse = "%Y%m%d-%H:%M:%S.%f"
    format = "%Y-%m-%d %H:%M:%S.%f %Z"
    zone = "local"

    [panes.market-allocation-blotter.types.timestamp]
    type = "time"
    parse = "%Y%m%d-%H:%M:%S.%f"
    format = "%Y-%m-%d %H:%M:%S.%f %Z"
    zone = "local"

    [panes.market-allocation-blotter.types.updated_at]
    type = "time"
    parse = "%Y%m%d-%H:%M:%S.%f"
    format = "%Y-%m-%d %H:%M:%S.%f %Z"
    zone = "local"

  [panes.market-allocation-blotter.styles]
  status = [
    { when = "value == 'PendingNew'", color = "#dcdcaa", italic = true },
    { when = "value == 'Sent'", color = "#dcdcaa", italic = true },
    { when = "value == 'Accepted'", color = "#6a9955", bold = true },
    { when = "value == 'Received'", color = "#4ec9b0" },
    { when = "value == 'Incomplete'", color = "#dcdcaa" },
    { when = "value == 'Rejected'", color = "#f44747" },
    { when = "value == 'Canceled'", color = "#858585", strike = true },
    { when = "value == 'Failed'", color = "#f44747" },
  ]
  alloc_rej_reason = [{ when = "value != ''", color = "#f44747" }]

    [[panes.market-allocation-blotter.styles.side]]
    when = "value == 'Buy'"
    color = "#4ec9b0"

    [[panes.market-allocation-blotter.styles.side]]
    when = "CONTAINS(['Sell', 'SellShort', 'SellShortExempt', 'SellPlus'], value)"
    color = "#f44747"

    [[panes.market-allocation-blotter.styles.pending_action]]
    when = "CONTAINS(['New', 'Cancel', 'Replace'], value)"
    color = "#dcdcaa"
    bold = true
    background = "#3a2f1b"

