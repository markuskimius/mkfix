[panes.ioi-blotter]
title = "Received IOIs"
type = "mkio-table"
service = "iois_query"
protocol = "query"
filter = "direction == 'RX'"
columns = [
  "ioi_id", "ioi_ref_id", "session_id", "client", "symbol", "instrument", "security_type",
  "maturity", "strike_price", "put_or_call", "cfi_code", "underlying_symbol",
  "underlying_security_type", "underlying_maturity", "multiplier", "security_exchange",
  "security_id", "security_id_source", "side", "ioi_qty", "price", "currency", "valid_until",
  "qlty_ind", "natural_flag", "qualifiers", "status", "ioi_trans_type", "order_cl_ord_id", "text",
  "extra_tags", "macro", "updated_at", "id", "ioi_trans_type_code", "side_code", "qlty_ind_code",
  "transact_time", "timestamp", "direction", "raw_message", "session_status",
]
visible = [
  "ioi_id", "ioi_ref_id", "session_id", "client", "instrument", "side", "ioi_qty", "price",
  "currency", "valid_until", "qlty_ind", "natural_flag", "qualifiers", "status", "ioi_trans_type",
  "order_cl_ord_id", "text", "extra_tags", "macro", "updated_at",
]
filters = { updated_at = { preset = "today" } }
display = { raw_message = "${REPLACE(value, '\\u{1}', '|')}" }

  [panes.ioi-blotter.history]
  table = "fix_iois"
  key = ["id"]
  versions = "iois_versions"
  state = "iois_state"
  feed = "iois_history"
  asOf = "received_iois_as_of"
  columns = [
    "ioi_id", "ioi_ref_id", "ioi_trans_type", "instrument", "side", "ioi_qty", "price", "currency",
    "valid_until", "qlty_ind", "natural_flag", "qualifiers", "status", "order_cl_ord_id", "text",
    "extra_tags",
  ]

