    width = 0.5

  [[dialogs.run_end_to_end.fields]]
  type = "readonly"
  value = "An end-to-end macro plays both sides in one run. It is offered what arrives before the Client and Market runs are, so a desk that is armed does not answer its orders."

[dialogs.play_macro]
title = "Play ${row.side} macros"
width = 440

  [dialogs.play_macro.submit]
  label = "Play"
  service = "fix_cmd"
  op = "play_macro"
  then = { action = "macro.refresh" }

  [[dialogs.play_macro.fields]]
  name = "side"
  type = "hidden"
  value = "${row.side}"

  [[dialogs.play_macro.fields]]
  name = "what"
  label = "Macros, and paused runs to resume"
  type = "checklist"
  size = 8
  all = "All of them"
  none = "No ${row.side} macro checks clean yet, and no run is paused"
  value = ""
  required = true
  invalidMessage = "Tick at least one"

    [dialogs.play_macro.fields.optionsFrom]
    service = "macro_play_options"
    params = { side = "${row.side}", recording = "${row.recording}" }
    value = "value"
    label = "label"

  [[dialogs.play_macro.fields]]
  name = "session"
  label = "${IF(row.side == 'client', 'Session to send on', 'Only this session\\'s orders')}"
  type = "select"
  showWhen = "CONTAINS(what ?? '', 'macro:') or CONTAINS(what ?? '', 'needs:')"
  required = "CONTAINS(what ?? '', 'needs:')"
  value = ""

    [dialogs.play_macro.fields.optionsFrom]
    service = "sessions_list"
    value = "session_id"
    label = "session_id"
    empty = "${IF(row.side == 'client', '(the one the macro names)', '(any session)')}"

  [[dialogs.play_macro.fields]]

    [[dialogs.play_macro.fields.row]]
    name = "speed"
    label = "Speed"
    type = "number"
    value = 1
    min = 0.01
    step = "any"
    width = 0.5
    showWhen = "CONTAINS(what ?? '', 'macro:') or CONTAINS(what ?? '', 'needs:')"

    [[dialogs.play_macro.fields.row]]
    name = "seed"
    label = "Seed (blank: the macro's, or random)"
    type = "text"
    value = ""
    width = 0.5
    showWhen = "CONTAINS(what ?? '', 'macro:') or CONTAINS(what ?? '', 'needs:')"

  [[dialogs.play_macro.fields]]
  type = "readonly"
  showWhen = "CONTAINS(what ?? '', 'macro:') or CONTAINS(what ?? '', 'needs:')"
  value = "The session, speed and seed are for every macro ticked; a seed left blank is each macro's own, or random."

[dialogs.pause_runs]
title = "Pause on the ${row.side} side"
width = 440

  [dialogs.pause_runs.submit]
  label = "Pause"
  service = "fix_cmd"
  op = "pause_runs"
  then = { action = "macro.refresh" }

  [[dialogs.pause_runs.fields]]
  name = "side"
  type = "hidden"
  value = "${row.side}"

  [[dialogs.pause_runs.fields]]
  name = "runs"
  label = "${IF(row.recording == 'on', 'Runs and the recording', 'Runs')}"
  type = "checklist"
  size = 8
  all = "${IF(row.recording == 'on', 'Everything', 'Every playing run')}"
  none = "No run of this side is playing"
  value = "*"
  required = true
  invalidMessage = "Tick at least one"

    [dialogs.pause_runs.fields.optionsFrom]
    service = "macro_run_options"
    params = { side = "${row.side}", paused = 0, recording = "${row.recording}" }
    value = "value"
    label = "label"

  [[dialogs.pause_runs.fields]]
  type = "readonly"
  value = "A paused run parks each order's macro before its next line; a wait under way runs out. ▶ resumes it."

  [[dialogs.pause_runs.fields]]
  type = "readonly"
  showWhen = "row.recording == 'on'"
  value = "A paused recording follows nothing you do, and no order that comes meanwhile; the time is in no delay. ▶ resumes it."

[dialogs.stop_runs]
title = "Stop on the ${row.side} side"
width = 440

  [dialogs.stop_runs.submit]
  label = "Stop"
  service = "fix_cmd"
  op = "stop_runs"
  then = { action = "macro.stopped", args = { side = "${row.side}", runs = "${runs}" } }

  [[dialogs.stop_runs.fields]]
  name = "side"
  type = "hidden"
  value = "${row.side}"

  [[dialogs.stop_runs.fields]]
  name = "runs"
  label = "${IF(row.recording != '', 'Runs and the recording', 'Runs')}"
  type = "checklist"
  size = 8
  all = "${IF(row.recording != '', 'Everything', 'Every live run')}"
  none = "No run of this side is live"
  value = "*"
  required = true
  invalidMessage = "Tick at least one"

    [dialogs.stop_runs.fields.optionsFrom]
    service = "macro_run_options"
    params = { side = "${row.side}", paused = 1, recording = "${row.recording}" }
    value = "value"
    label = "label"

  [[dialogs.stop_runs.fields]]
  type = "readonly"
  value = "A stopped run is over: its orders are yours again, and no new ones are taken."

  [[dialogs.stop_runs.fields]]
  type = "readonly"
  showWhen = "row.recording != ''"
  value = "Stopping the recording writes its macro: you are asked for a name next."

[dialogs.record_macro]
title = "Record a ${row.side} macro"
width = 380

  [dialogs.record_macro.submit]
  label = "Record"
  service = "fix_cmd"
  op = "record_start"
