        compute = "CONCAT(CONCAT('117=', row.quote_id, '|694=2'), IF(bid_size != NULL, CONCAT('|134=', STR(bid_size)), ''), IF(bid_px != NULL, CONCAT('|132=', STR(bid_px)), ''), IF(offer_px != NULL, CONCAT('|133=', STR(offer_px)), ''), IF(offer_size != NULL, CONCAT('|135=', STR(offer_size)), ''), IF(COALESCE(text, '') != '', CONCAT('|58=', text), ''), IF(COALESCE(extra_tags, '') != '', CONCAT('|', extra_tags), ''))"

