        value = "Written from the messages kept: the macro that would have played this side's part in what it has been through. The quotes you took, countered or passed become `hit`, `counter` and `pass quote` in the RFQ's `run` block; orders naming a quote, `new`."

        [[panes.rfq-blotter.buttons.action.dialog.fields]]
        type = "readonly"
        showWhen = "not delays"
        value = "Each action will run the moment what it answered comes. Time is written only where nothing came between two actions."

        [[panes.rfq-blotter.buttons.action.dialog.fields]]
        type = "readonly"
        showWhen = "delays"
        value = "Each action will also wait the time it took to answer."

        [[panes.rfq-blotter.buttons.action.dialog.fields]]
        type = "readonly"
