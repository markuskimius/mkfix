  [panes.market-order-blotter.styles]
  status = [
    { when = "value == 'Filled'", color = "#6a9955", bold = true },
    { when = "value == 'PartiallyFilled'", color = "#4ec9b0" },
    { when = "value == 'Replaced'", color = "#dcdcaa" },
    { when = "value == 'PendingNew'", color = "#dcdcaa", italic = true },
    { when = "value == 'Rejected'", color = "#f44747" },
    { when = "value == 'Canceled'", color = "#858585", strike = true },
  ]
  legs = [{ when = "value != ''", color = "#9cdcfe", bold = true }]
  instrument = [{ when = "ENDS_WITH(value, ' MLEG')", color = "#9cdcfe" }]

    [[panes.market-order-blotter.styles.side]]
    when = "value == 'Buy'"
    color = "#4ec9b0"

    [[panes.market-order-blotter.styles.side]]
    when = "CONTAINS(['Sell', 'SellShort', 'SellShortExempt', 'SellPlus'], value)"
    color = "#f44747"

    [[panes.market-order-blotter.styles.pending_action]]
    when = "CONTAINS(['New', 'Cancel', 'Replace'], value)"
    color = "#dcdcaa"
    bold = true
    background = "#3a2f1b"

