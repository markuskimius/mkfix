  label = "Terms"
  columns = ["side", "order_qty", "currency", "quote_request_type"]

  [[panes.quote-blotter.groups]]
  label = "Quote"
  columns = [
    "bid_size", "bid_px", "offer_px", "offer_size", "valid_until", "quote_type", "quote_status",
    "quote_extra_tags",
  ]

  [[panes.quote-blotter.groups]]
  label = "Response"
  columns = ["quote_resp_id", "quote_resp_type", "rej_reason"]

  [[panes.quote-blotter.groups]]
  label = "Status"
  columns = ["status"]

  [[panes.quote-blotter.groups]]
  label = "Pending"
  columns = [
    "pending_action", "pending_bid_px", "pending_offer_px", "pending_bid_size",
    "pending_offer_size", "pending_resp_id", "pending_extra_tags",
  ]

  [[panes.quote-blotter.groups]]
  label = "Text & Tags"
  columns = ["sent_text", "text", "extra_tags", "macro"]

  [[panes.quote-blotter.groups]]
  label = "Times"
  columns = ["updated_at", "transact_time", "timestamp"]

  [[panes.quote-blotter.groups]]
  label = "Internal"
  columns = [
    "id", "origin", "direction", "side_code", "quote_request_type_code", "quote_type_code",
    "quote_status_code", "rej_reason_code", "quote_resp_type_code", "raw_message",
  ]

  [panes.quote-blotter.types]

    [panes.quote-blotter.types.valid_until]
    type = "time"
    parse = "%Y%m%d-%H:%M:%S.%f"
    format = "%Y-%m-%d %H:%M:%S.%f %Z"
    zone = "local"

    [panes.quote-blotter.types.transact_time]
    type = "time"
    parse = "%Y%m%d-%H:%M:%S.%f"
    format = "%Y-%m-%d %H:%M:%S.%f %Z"
    zone = "local"

    [panes.quote-blotter.types.timestamp]
    type = "time"
    parse = "%Y%m%d-%H:%M:%S.%f"
    format = "%Y-%m-%d %H:%M:%S.%f %Z"
    zone = "local"

    [panes.quote-blotter.types.updated_at]
    type = "time"
    parse = "%Y%m%d-%H:%M:%S.%f"
    format = "%Y-%m-%d %H:%M:%S.%f %Z"
    zone = "local"

  [panes.quote-blotter.styles]
  status = [
    { when = "value == 'Open'", color = "#dcdcaa", italic = true },
    { when = "value == 'Quoted'", color = "#4ec9b0" },
    { when = "value == 'Countered'", color = "#dcdcaa", bold = true },
    { when = "value == 'Hit'", color = "#6a9955", bold = true },
    { when = "CONTAINS(['Passed', 'Expired'], value)", color = "#858585", italic = true },
    { when = "value == 'Canceled'", color = "#858585", strike = true },
    { when = "CONTAINS(['Rejected', 'Failed'], value)", color = "#f44747" },
  ]
  pending_action = [
    { when = "value == 'Counter'", color = "#dcdcaa", bold = true, background = "#3a2f1b" },
  ]
  rej_reason = [{ when = "value != ''", color = "#f44747" }]
  bid_px = [{ when = "value != NULL", color = "#4ec9b0" }]
  offer_px = [{ when = "value != NULL", color = "#f44747" }]

    [[panes.quote-blotter.styles.side]]
    when = "value == 'Buy'"
    color = "#4ec9b0"

    [[panes.quote-blotter.styles.side]]
    when = "CONTAINS(['Sell', 'SellShort', 'SellShortExempt', 'SellPlus'], value)"
    color = "#f44747"

  [[panes.quote-blotter.buttons]]
  label = "Hit"
  unit = "row"

    [panes.quote-blotter.buttons.enable]
    connected = true
    when = "ALL(rows, r -> CONTAINS(['Quoted', 'Countered'], r.status) && r.session_status == 'ACTIVE')"

    [panes.quote-blotter.buttons.action]
    type = "dialog"

      [panes.quote-blotter.buttons.action.dialog]
      title = "Hit ${row.quote_id}"
      pin = "keep"
      width = 420
      submitPerRow = true
      rowData = { session_id = "${row.session_id}", quote_id = "${row.quote_id}" }
      submit = { label = "Hit", service = "fix_cmd", op = "hit_quote" }

        [[panes.quote-blotter.buttons.action.dialog.fields]]
        name = "_template"
        label = "Template"
        type = "select"

          [panes.quote-blotter.buttons.action.dialog.fields.optionsFrom]
          service = "templates_list"
          params = { scope = "hit" }
          value = "name"
          label = "name"

          [panes.quote-blotter.buttons.action.dialog.fields.fill]
          side = "side"
          qty = "qty"
          price = "price"
          text = "text"
          extra_tags = "extra_tags"

          [panes.quote-blotter.buttons.action.dialog.fields.remember]
          key = "mkfix.template.hit_quote"
          value = "IF(COALESCE(save_as, '') != '', save_as, _template)"

        [[panes.quote-blotter.buttons.action.dialog.fields]]
        name = "side"
        label = "Side (54)"
        type = "select"
        options = [
          { value = "1", label = "1 - Buy (lift the offer)" },
          { value = "2", label = "2 - Sell (hit the bid)" },
        ]
        value = "${IF(row.side_code != '', row.side_code, '1')}"
        required = true

        [[panes.quote-blotter.buttons.action.dialog.fields]]

          [[panes.quote-blotter.buttons.action.dialog.fields.row]]
          name = "qty"
          label = "Quantity (38)"
          type = "number"
          placeholder = "optional"
          min = 0
          value = "${IF(row.side_code == '2', IF(row.bid_size != NULL, row.bid_size, row.order_qty), IF(row.offer_size != NULL, row.offer_size, row.order_qty))}"
          width = 0.5

          [[panes.quote-blotter.buttons.action.dialog.fields.row]]
          name = "price"
          label = "Price (44)"
          type = "number"
          placeholder = "optional"
          step = "0.01"
          value = "${IF(row.side_code == '2', row.bid_px, row.offer_px)}"
          width = 0.5

        [[panes.quote-blotter.buttons.action.dialog.fields]]
        type = "readonly"
        value = "A QuoteResponse (35=AJ): FIX 4.4 and later. On an earlier session take the quote with Order… instead."

        [[panes.quote-blotter.buttons.action.dialog.fields]]
        name = "text"
        label = "Text (58)"
        type = "text"
        placeholder = "optional"

        [[panes.quote-blotter.buttons.action.dialog.fields]]
        name = "extra_tags"
        label = "Extra Tags"
        type = "text"
        placeholder = "e.g. 5001=X|382=2|375=A|375=B"

        [[panes.quote-blotter.buttons.action.dialog.fields]]
        name = "save_as"
        pin = "reset"
        label = "Save as template"
        type = "text"
        placeholder = "optional — a name keeps these terms for next time"

        [[panes.quote-blotter.buttons.action.dialog.fields]]
        label = "Terms as tags"
        type = "readonly"
        compute = "CONCAT(CONCAT('117=', row.quote_id, '|694=1|11=(new)|54=', side), IF(qty != NULL, CONCAT('|38=', STR(qty)), ''), '|40=D', IF(price != NULL, CONCAT('|44=', STR(price)), ''), IF(COALESCE(text, '') != '', CONCAT('|58=', text), ''), IF(COALESCE(extra_tags, '') != '', CONCAT('|', extra_tags), ''))"

