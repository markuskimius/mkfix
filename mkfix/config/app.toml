          [[panes.ioi-blotter.buttons.action.dialog.fields.fields]]
          name = "save_instrument_as"
          pin = "reset"
          label = "Save instrument as"
          type = "text"
          placeholder = "optional — a name keeps this instrument in Config › Instruments"

        [[panes.ioi-blotter.buttons.action.dialog.fields]]

          [[panes.ioi-blotter.buttons.action.dialog.fields.row]]
          name = "qty"
          label = "Quantity (38)"
          type = "number"
          placeholder = "100"
          min = 1
          width = 0.5
          required = true
          value = "${row.ioi_qty}"

          [[panes.ioi-blotter.buttons.action.dialog.fields.row]]
          name = "ord_type"
          label = "Order Type (40)"
          type = "select"
          width = 0.5
          options = [
            { value = "1", label = "1 - Market" },
            { value = "2", label = "2 - Limit" },
            { value = "5", label = "5 - Market on Close (<= FIX 4.3)" },
            { value = "B", label = "B - Limit on Close (<= FIX 4.3)" },
            { value = "I", label = "I - Funari" },
          ]
          value = "2"

        [[panes.ioi-blotter.buttons.action.dialog.fields]]
        type = "readonly"
        showWhen = "CONTAINS(['5', 'B'], ord_type)"
        value = "Defined through FIX 4.3 (and again in 5.0). Elsewhere it is a non-standard OrdType, allowed for testing."

        [[panes.ioi-blotter.buttons.action.dialog.fields]]

          [[panes.ioi-blotter.buttons.action.dialog.fields.row]]
          name = "price"
          label = "Price (44)"
          type = "number"
          placeholder = "0.00"
          step = "0.01"
          width = 0.5
          value = "${row.price}"

          [[panes.ioi-blotter.buttons.action.dialog.fields.row]]
          name = "tif"
          label = "Time in Force (59)"
          type = "select"
          width = 0.5
          options = [
            { value = "0", label = "0 - Day" },
            { value = "1", label = "1 - GTC" },
            { value = "2", label = "2 - At the Opening" },
            { value = "3", label = "3 - IOC" },
            { value = "4", label = "4 - FOK" },
            { value = "5", label = "5 - GTX" },
            { value = "6", label = "6 - GTD" },
            { value = "7", label = "7 - At the Close (>= FIX 4.2)" },
          ]
          value = "0"

        [[panes.ioi-blotter.buttons.action.dialog.fields]]
        type = "readonly"
        showWhen = "tif == '7'"
        value = "Defined from FIX 4.2. Earlier it is a non-standard TimeInForce, allowed for testing."

        [[panes.ioi-blotter.buttons.action.dialog.fields]]
        name = "handl_inst"
        label = "Handling Inst (21)"
        type = "select"
        value = "1"
        options = [
          { value = "1", label = "1 - Automated, private, no broker intervention" },
          { value = "2", label = "2 - Automated, public, broker intervention OK" },
          { value = "3", label = "3 - Manual, best execution" },
        ]

        [[panes.ioi-blotter.buttons.action.dialog.fields]]
        name = "text"
        label = "Text (58)"
        type = "text"
        placeholder = "optional"

        [[panes.ioi-blotter.buttons.action.dialog.fields]]
        name = "extra_tags"
        label = "Extra Tags"
        type = "text"
        placeholder = "e.g. 5001=X|382=2|375=A|375=B"
        value = "23=${row.ioi_id}"

        [[panes.ioi-blotter.buttons.action.dialog.fields]]
        group = "Advanced"
        collapsible = true
        collapsed = true

          [[panes.ioi-blotter.buttons.action.dialog.fields.fields]]

            [[panes.ioi-blotter.buttons.action.dialog.fields.fields.row]]
            name = "expire_time"
            label = "Expire (126/432; local, time optional)"
            type = "datetime"
            time = "optional"
            step = 1

          [[panes.ioi-blotter.buttons.action.dialog.fields.fields]]
          name = "save_as"
          pin = "reset"
          label = "Save as template"
          type = "text"
          placeholder = "optional — a name keeps these terms for next time"

        [[panes.ioi-blotter.buttons.action.dialog.fields]]
        label = "Terms as tags"
        type = "readonly"
        compute = "CONCAT('55=', COALESCE(symbol, ''), '|54=', side, '|38=', STR(qty), '|40=', ord_type, IF(price != NULL, CONCAT('|44=', STR(price)), ''), '|59=', tif, '|21=', handl_inst, IF(COALESCE(text, '') != '', CONCAT('|58=', text), ''), IF(COALESCE(extra_tags, '') != '', CONCAT('|', extra_tags), ''))"

  [[panes.ioi-blotter.buttons]]
  label = "Macro…"
  enable = { connected = true, minSelected = 1 }

    [panes.ioi-blotter.buttons.action]
    type = "dialog"

      [panes.ioi-blotter.buttons.action.dialog]
      title = "Macro from ${IF(LEN(rows) > 1, CONCAT(LEN(rows), ' IOIs'), row.ioi_id)}"
      width = 400

        [[panes.ioi-blotter.buttons.action.dialog.fields]]
        name = "side"
        type = "hidden"
        value = "client"

        [[panes.ioi-blotter.buttons.action.dialog.fields]]
        name = "subject"
        type = "hidden"
        value = "ioi"

        [[panes.ioi-blotter.buttons.action.dialog.fields]]
        name = "row_ids"
        type = "hidden"
        value = "${JOIN(MAP(rows, r -> r.id), ',')}"

        [[panes.ioi-blotter.buttons.action.dialog.fields]]
        name = "save"
        type = "hidden"
        value = "1"

        [[panes.ioi-blotter.buttons.action.dialog.fields]]
        name = "name"
        label = "Save the macro as"
        type = "text"
        required = true
        value = "History of ${row.ioi_id}${IF(LEN(rows) > 1, CONCAT(' and ', LEN(rows) - 1, ' more'), '')}"

        [[panes.ioi-blotter.buttons.action.dialog.fields]]
        name = "delays"
        label = "Keep the delays"
        type = "checkbox"
        value = false

        [[panes.ioi-blotter.buttons.action.dialog.fields]]
        type = "readonly"
        value = "Written from the messages kept: the macro that would have played this side's part in what it has been through. The orders you sent against the IOI become `new` actions in an `on ioi` block."

        [[panes.ioi-blotter.buttons.action.dialog.fields]]
        type = "readonly"
        showWhen = "not delays"
        value = "Each action will run the moment what it answered comes. Time is written only where nothing came between two actions."

        [[panes.ioi-blotter.buttons.action.dialog.fields]]
        type = "readonly"
        showWhen = "delays"
        value = "Each action will also wait the time it took to answer."

        [[panes.ioi-blotter.buttons.action.dialog.fields]]
        type = "readonly"
        value = "The macro opens in Client Macros. If the name is taken, or there is nothing to write, nothing is saved."

        [panes.ioi-blotter.buttons.action.dialog.submit]
        label = "Write macro"
        service = "fix_cmd"
        op = "macro_from_history"

          [panes.ioi-blotter.buttons.action.dialog.submit.then]
          action = "macro.recorded"
          args = { side = "client", name = "${name}", from = "history" }

  [[panes.ioi-blotter.buttons]]
  label = "History"
  unit = "row"
  enable = { connected = true }
  action = { type = "action", name = "table.history", args = { pane = "ioi-blotter" } }

