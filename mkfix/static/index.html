<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>mkfix — FIX Protocol Testing Engine</title>
  <link rel="stylesheet" href="/mkui/styles/mkui.css">
  <link rel="stylesheet" href="/static/mkfix.css">
  <script type="module">
    import "/mkui/src/index.js";
    import "/static/panes/message-detail.js";
    import "/static/panes/replay-control.js";

    // Revalidate rather than trust heuristic freshness: mkio serves static
    // files without Cache-Control, so a stale app.json silently pins the UI
    // to an old layout.
    const res = await fetch("/static/app.json", { cache: "no-cache" });
    const config = await res.json();
    const wsProto = location.protocol === "https:" ? "wss:" : "ws:";
    config.mkio.url = `${wsProto}//${location.host}/ws`;
    document.querySelector("mkui-app").setConfig(config);
  </script>
</head>
<body>
  <mkui-app></mkui-app>
</body>
</html>
