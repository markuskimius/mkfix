<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>mkfix — FIX Protocol Testing Engine</title>
  <link rel="stylesheet" href="/mkui/styles/mkui.css">
  <link rel="stylesheet" href="/static/mkfix.css">
  <script type="module">
    import "/mkui/src/index.js";
    import "/static/panes/message-detail.js";
    import "/static/panes/dictionaries.js";
    import "/static/panes/macros.js";
    import "/static/panes/help-viewer.js";
    import "/static/macro-status.js";

    // config/app.toml, which mkio serves as JSON. Revalidate rather than
    // trust heuristic freshness: a stale config silently pins the UI to an
    // old layout.
    const res = await fetch("/config/app.json", { cache: "no-cache" });
    if (!res.ok) {
      // A custom mkfix.toml written before 0.87.0 has no [config] route.
      document.body.textContent = `mkfix: /config/app.json answered ${res.status}. `
        + 'The server config needs the [config] route: "/config" = "./config".';
      throw new Error("no UI config");
    }
    const config = await res.json();
    const wsProto = location.protocol === "https:" ? "wss:" : "ws:";
    config.mkio.url = `${wsProto}//${location.host}/ws`;
    // The About box lists its own lines, and a template cannot reach mkui's
    // version: it is in neither app state nor the config.
    config.app.mkui = window.Mkui.VERSION;
    document.querySelector("mkui-app").setConfig(config);
  </script>
</head>
<body>
  <mkui-app></mkui-app>
</body>
</html>
